                                                <button type="button" onclick="openEditStandardServiceModal(${s.id})" aria-label="${currentLanguage === 'en' ? 'Edit service' : 'Sửa dịch vụ'}" class="rounded-lg border border-slate-700 px-2 py-1.5 text-slate-300 hover:bg-white/5"><i class="fa-solid fa-pen"></i></button>
                                                <button type="button" onclick="deleteStandardService(${s.id})" aria-label="${currentLanguage === 'en' ? 'Delete service' : 'Xóa dịch vụ'}" class="ml-1 rounded-lg border border-rose-500/20 px-2 py-1.5 text-rose-300 hover:bg-rose-500/10"><i class="fa-regular fa-trash-can"></i></button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                    ${services.length === 0 ? `<tr><td colspan="5" class="p-6 text-center text-slate-400">Không có dịch vụ phù hợp.</td></tr>` : ''}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function openAddUserModal() {
            if (!currentUser || currentUser.role !== 'admin') return;
            openModal(`
                <div class="p-6">
                    <div class="flex items-center justify-between border-b border-slate-700 pb-4">
                        <div><p class="text-xs font-bold uppercase tracking-wider text-violet-300">Tài khoản</p><h3 class="mt-1 text-lg font-black text-slate-100">Thêm người dùng</h3></div>
                        <button type="button" onclick="closeModal()" aria-label="Đóng" class="text-slate-400 hover:text-slate-100"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <form onsubmit="handleCreateUser(event)" class="mt-5 space-y-4">
                        <div><label class="mb-1 block text-xs font-bold uppercase tracking-wider text-slate-400">Họ và tên</label><input id="user-new-name" required class="w-full rounded-xl border px-3.5 py-2.5 text-sm"></div>
                        <div><label class="mb-1 block text-xs font-bold uppercase tracking-wider text-slate-400">Email</label><input id="user-new-email" type="email" required class="w-full rounded-xl border px-3.5 py-2.5 text-sm"></div>
                        <div><label class="mb-1 block text-xs font-bold uppercase tracking-wider text-slate-400">Mật khẩu tạm</label><input id="user-new-pass" type="password" minlength="8" autocomplete="new-password" required class="w-full rounded-xl border px-3.5 py-2.5 text-sm"><p class="mt-1 text-xs text-slate-500">Tối thiểu 8 ký tự.</p></div>
                        <div><label class="mb-1 block text-xs font-bold uppercase tracking-wider text-slate-400">Vai trò</label><select id="user-new-role" class="w-full rounded-xl border px-3.5 py-2.5 text-sm"><option value="owner">Owner</option><option value="admin">Admin</option></select></div>
                        <div class="flex justify-end gap-3 border-t border-slate-700 pt-4"><button type="button" onclick="closeModal()" class="rounded-xl border border-slate-700 px-4 py-2 text-sm font-semibold text-slate-300 hover:bg-white/5">Hủy</button><button type="submit" class="rounded-xl bg-violet-600 px-5 py-2 text-sm font-bold text-white hover:bg-violet-700">Tạo tài khoản</button></div>
                    </form>
                </div>
            `);
        }

        async function handleCreateUser(e) {
            e.preventDefault();
            if (!currentUser || currentUser.role !== 'admin') return;
            const name = document.getElementById('user-new-name').value.trim();
            const email = document.getElementById('user-new-email').value.trim();
            const pass = document.getElementById('user-new-pass').value;
            const role = document.getElementById('user-new-role').value === 'admin' ? 'admin' : 'owner';
            const users = DB.get('users');
            if (pass.length < 8) {
                showToast("Mật khẩu phải từ 8 ký tự trở lên.", "error");
                return;
            }
            if (users.some(user => user.email.toLowerCase() === email.toLowerCase())) {
                showToast("Email này đã được sử dụng.", "error");
                return;
            }
            if (!passwordCryptoAvailable()) {
                showToast('Trình duyệt không hỗ trợ lưu mật khẩu an toàn.', 'error');
                return;
            }
            try {
                users.push({
                    id: Date.now(),
                    name,
                    email,
                    ...(await createPasswordRecord(pass)),
                    role,
                    avatar: `https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(name)}&backgroundColor=c4b5fd`
                });
            } catch (error) {
                showToast('Không thể tạo mật khẩu bảo vệ. Vui lòng thử lại.', 'error');
                return;
            }
            DB.set('users', users);
            closeModal();
            showToast("Đã tạo tài khoản người dùng.", "success");
            renderCurrentTabContent();
        }

        function openEditUserModal(id) {
            if (!currentUser || currentUser.role !== 'admin') return;
            const user = DB.get('users').find(item => item.id === id);
            if (!user) return;

            openModal(`
                <div class="p-6">
                    <div class="flex items-center justify-between border-b border-slate-700 pb-4">
                        <div><p class="text-xs font-bold uppercase tracking-wider text-violet-300">Tài khoản</p><h3 class="mt-1 text-lg font-black text-slate-100">Chỉnh sửa người dùng</h3></div>
                        <button type="button" onclick="closeModal()" aria-label="Đóng" class="text-slate-400 hover:text-slate-100"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <form onsubmit="handleUpdateUser(event, ${user.id})" class="mt-5 space-y-4">
                        <div><label class="mb-1 block text-xs font-bold uppercase tracking-wider text-slate-400">Họ và tên</label><input id="user-edit-name" required value="${escapeHTML(user.name)}" class="w-full rounded-xl border px-3.5 py-2.5 text-sm"></div>
                        <div><label class="mb-1 block text-xs font-bold uppercase tracking-wider text-slate-400">Email</label><input id="user-edit-email" type="email" required value="${escapeHTML(user.email)}" class="w-full rounded-xl border px-3.5 py-2.5 text-sm"></div>
                        <div><label class="mb-1 block text-xs font-bold uppercase tracking-wider text-slate-400">Vai trò</label><select id="user-edit-role" class="w-full rounded-xl border px-3.5 py-2.5 text-sm"><option value="owner" ${user.role === 'owner' ? 'selected' : ''}>Owner</option><option value="admin" ${user.role === 'admin' ? 'selected' : ''}>Admin</option></select></div>
                        <div class="flex justify-end gap-3 border-t border-slate-700 pt-4"><button type="button" onclick="closeModal()" class="rounded-xl border border-slate-700 px-4 py-2 text-sm font-semibold text-slate-300 hover:bg-white/5">Hủy</button><button type="submit" class="rounded-xl bg-violet-600 px-5 py-2 text-sm font-bold text-white hover:bg-violet-700">Lưu thay đổi</button></div>
                    </form>
                </div>
            `);
        }

        function handleUpdateUser(e, id) {
            e.preventDefault();
            if (!currentUser || currentUser.role !== 'admin') return;
            const users = DB.get('users');
            const user = users.find(item => item.id === id);
            if (!user) return;
            const name = document.getElementById('user-edit-name').value.trim();
            const email = document.getElementById('user-edit-email').value.trim();
            const role = document.getElementById('user-edit-role').value === 'admin' ? 'admin' : 'owner';

            if (users.some(item => item.id !== id && item.email.toLowerCase() === email.toLowerCase())) {
                showToast("Email này đã được tài khoản khác sử dụng.", "error");
                return;
            }
            if (user.role === 'admin' && role !== 'admin' && users.filter(item => item.role === 'admin').length <= 1) {
                showToast("Hệ thống cần giữ lại ít nhất một tài khoản Admin.", "error");
                return;
            }

            user.name = name;
            user.email = email;
            user.role = role;
            DB.set('users', users);
            if (currentUser.id === id) {
                currentUser = user;
                sessionStorage.setItem('pvmis_currentUser_v4', JSON.stringify(currentUser));
                currentTab = role === 'admin' ? 'admin' : 'dashboard';
            }
            closeModal();
            showToast("Đã cập nhật tài khoản người dùng.", "success");
            renderApp();
        }

        function deleteUser(id) {
            if (!currentUser || currentUser.role !== 'admin') return;
            const users = DB.get('users');
            const user = users.find(item => item.id === id);
            if (!user || user.id === currentUser.id) {
                showToast("Không thể xóa tài khoản Admin đang đăng nhập.", "error");
                return;
            }
            if (user.role === 'admin' && users.filter(item => item.role === 'admin').length <= 1) {
                showToast("Hệ thống cần giữ lại ít nhất một tài khoản Admin.", "error");
                return;
            }
            if (!confirm(translateText(`Xóa tài khoản ${user.name} cùng phương tiện và dữ liệu bảo dưỡng thuộc tài khoản này? Thao tác không thể hoàn tác.`))) return;

            const vehicleIds = DB.get('vehicles').filter(v => v.userId === id).map(v => v.id);
            DB.set('users', users.filter(item => item.id !== id));
            DB.set('vehicles', DB.get('vehicles').filter(v => v.userId !== id));
            DB.set('schedules', DB.get('schedules').filter(s => !vehicleIds.includes(s.vehicleId)));
            DB.set('history', DB.get('history').filter(h => !vehicleIds.includes(h.vehicleId)));
            showToast("Đã xóa người dùng cùng dữ liệu phương tiện liên quan.", "info");
            renderCurrentTabContent();
        }

        function openAddStandardServiceModal() {
            if (!currentUser || currentUser.role !== 'admin') return;
            openModal(`
                <div class="p-6">
                    <div class="flex justify-between items-center pb-4 border-b border-slate-100">
                        <h3 class="font-black text-lg text-slate-900">Thêm Dịch Vụ Quy Chuẩn</h3>
                        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                    </div>
                    <form onsubmit="handleCreateService(event)" class="space-y-4 mt-4">
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Tên dịch vụ *</label>
                            <input type="text" id="std-name" required placeholder="vd: Thay dầu hộp số tự động..." class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Phân loại xe</label>
                                <select id="std-cat" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none bg-white">
                                    <option value="Xe máy">Xe máy</option>
                                    <option value="Ô tô">Ô tô</option>
                                    <option value="Ô tô điện">Ô tô điện</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Giá tham khảo (VNĐ)</label>
                                <input type="number" id="std-price" value="500000" step="50000" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Chu kỳ khuyến nghị (km)</label>
                            <input type="number" id="std-interval" value="10000" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                        </div>
                        <div class="pt-4 flex justify-end space-x-3">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-200 text-sm font-semibold text-slate-600 hover:bg-slate-50">Huỷ</button>
                            <button type="submit" class="px-5 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-sm font-bold">Thêm hạng mục</button>
                        </div>
                    </form>
                </div>
            `);
        }

        function handleCreateService(e) {
            e.preventDefault();
            if (!currentUser || currentUser.role !== 'admin') return;
            const name = document.getElementById('std-name').value.trim();
            const category = document.getElementById('std-cat').value;
            const basePrice = parseInt(document.getElementById('std-price').value) || 0;
            const intervalKm = parseInt(document.getElementById('std-interval').value) || 5000;

            const services = DB.get('services');
            services.push({
                id: Date.now(),
                name,
                category,
                basePrice,
                intervalKm
            });
            DB.set('services', services);
            closeModal();
            showToast("Đã thêm quy chuẩn dịch vụ mới!", "success");
            renderCurrentTabContent();
        }

        function openEditStandardServiceModal(id) {
            if (!currentUser || currentUser.role !== 'admin') return;
            const service = DB.get('services').find(item => item.id === id);
            if (!service) return;

            openModal(`
                <div class="p-6">
                    <div class="flex items-center justify-between border-b border-slate-700 pb-4">
                        <div><p class="text-xs font-bold uppercase tracking-wider text-violet-300">Danh mục dịch vụ</p><h3 class="mt-1 text-lg font-black text-slate-100">Chỉnh sửa dịch vụ</h3></div>
                        <button type="button" onclick="closeModal()" aria-label="Đóng" class="text-slate-400 hover:text-slate-100"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <form onsubmit="handleUpdateService(event, ${service.id})" class="mt-5 space-y-4">
                        <div><label class="mb-1 block text-xs font-bold uppercase tracking-wider text-slate-400">Tên dịch vụ</label><input id="std-name" required value="${escapeHTML(service.name)}" class="w-full rounded-xl border px-3.5 py-2.5 text-sm"></div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div><label class="mb-1 block text-xs font-bold uppercase tracking-wider text-slate-400">Loại xe</label><select id="std-cat" class="w-full rounded-xl border px-3.5 py-2.5 text-sm"><option ${service.category === 'Xe máy' ? 'selected' : ''}>Xe máy</option><option ${service.category === 'Ô tô' ? 'selected' : ''}>Ô tô</option><option ${service.category === 'Ô tô điện' ? 'selected' : ''}>Ô tô điện</option></select></div>
                            <div><label class="mb-1 block text-xs font-bold uppercase tracking-wider text-slate-400">Giá tham khảo (VNĐ)</label><input id="std-price" type="number" min="0" value="${Number(service.basePrice) || 0}" class="w-full rounded-xl border px-3.5 py-2.5 text-sm"></div>
                        </div>
                        <div><label class="mb-1 block text-xs font-bold uppercase tracking-wider text-slate-400">Chu kỳ khuyến nghị (km)</label><input id="std-interval" type="number" min="1" value="${Number(service.intervalKm) || 5000}" class="w-full rounded-xl border px-3.5 py-2.5 text-sm"></div>
                        <div class="flex justify-end gap-3 border-t border-slate-700 pt-4"><button type="button" onclick="closeModal()" class="rounded-xl border border-slate-700 px-4 py-2 text-sm font-semibold text-slate-300 hover:bg-white/5">Hủy</button><button type="submit" class="rounded-xl bg-violet-600 px-5 py-2 text-sm font-bold text-white hover:bg-violet-700">Lưu dịch vụ</button></div>
                    </form>
                </div>
            `);
        }

        function handleUpdateService(e, id) {
            e.preventDefault();
            if (!currentUser || currentUser.role !== 'admin') return;
            const services = DB.get('services');
            const service = services.find(item => item.id === id);
            if (!service) return;
            service.name = document.getElementById('std-name').value.trim();
            service.category = document.getElementById('std-cat').value;
            service.basePrice = Math.max(0, parseInt(document.getElementById('std-price').value) || 0);
            service.intervalKm = Math.max(1, parseInt(document.getElementById('std-interval').value) || 5000);
            DB.set('services', services);
            closeModal();
            showToast("Đã cập nhật dịch vụ.", "success");
            renderCurrentTabContent();
        }

        function deleteStandardService(id) {
            if (!currentUser || currentUser.role !== 'admin') return;
            const services = DB.get('services');
            const service = services.find(item => item.id === id);
            if (!service) return;
            if (!confirm(translateText(`Xóa dịch vụ “${service.name}” khỏi danh mục quy chuẩn? Các lịch sử đã ghi nhận vẫn được giữ nguyên.`))) return;
            DB.set('services', services.filter(item => item.id !== id));
            showToast("Đã xóa dịch vụ khỏi danh mục.", "info");
            renderCurrentTabContent();
        }

        // Migrates legacy plaintext passwords once, then starts the application.
        async function startPVMIS() {
            const root = document.getElementById('app-root');
            root.innerHTML = '<div class="min-h-screen flex items-center justify-center bg-slate-900 text-slate-300"><div class="flex items-center gap-3 rounded-2xl border border-slate-700 bg-slate-800 px-5 py-4 text-sm font-semibold"><i class="fa-solid fa-spinner fa-spin text-violet-400"></i> Đang tải dữ liệu an toàn…</div></div>';
            try {
                await ensurePasswordMigration();
            } catch (error) {
                console.warn('Không thể di trú mật khẩu cũ trong môi trường này.', error);
            }
            renderApp();
            window.__pvmisReady = true;
        }

        startPVMIS();
    </script>
</body>
</html>
