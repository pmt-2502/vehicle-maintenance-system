        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const icons = {
                success: 'fa-circle-check text-emerald-500',
                error: 'fa-circle-exclamation text-rose-500',
                info: 'fa-circle-info text-blue-500'
            };
            toast.className = `flex items-center space-x-3 px-4 py-3 rounded-xl shadow-lg border border-slate-200 bg-white text-sm pointer-events-auto transform transition-all duration-300 translate-y-2 opacity-0`;
            toast.innerHTML = `
                <i class="fa-solid ${icons[type] || icons.info} text-lg"></i>
                <span class="font-medium text-slate-700">${message}</span>
            `;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function openModal(htmlContent) {
            const modalContainer = document.getElementById('modal-container');
            const modalContent = document.getElementById('modal-content');
            modalContent.innerHTML = htmlContent;
            modalContainer.classList.remove('hidden');
            setTimeout(() => {
                modalContent.classList.remove('scale-95', 'opacity-0');
                modalContent.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            const modalContainer = document.getElementById('modal-container');
            const modalContent = document.getElementById('modal-content');
            modalContent.classList.remove('scale-100', 'opacity-100');
            modalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modalContainer.classList.add('hidden');
            }, 200);
        }

        function handleCreateVehicle(e) {
            e.preventDefault();
            const name = document.getElementById('veh-name').value.trim();
            const plate = document.getElementById('veh-plate').value.trim();
            const type = document.getElementById('veh-type').value;
            const odo = parseInt(document.getElementById('veh-odo').value) || 0;
            const year = parseInt(document.getElementById('veh-year').value) || 2023;
            let image = document.getElementById('veh-img').value.trim();

            if (!image) {
                image = type.includes('Ô tô') ? FALLBACK_CAR_IMG : FALLBACK_MOTO_IMG;
            }

            const vehicles = DB.get('vehicles');
            vehicles.push({
                id: Date.now(),
                userId: currentUser.id,
                name,
                plate,
                type,
                odo,
                year,
                image
            });
            DB.set('vehicles', vehicles);
            closeModal();
            showToast(`Đã thêm thành công xe ${name}!`, "success");
            renderCurrentTabContent();
        }

        function updateVehicleOdo(id, currentOdo) {
            const newOdoStr = prompt("Cập nhật số km (ODO) mới nhất của xe:", currentOdo);
            if (newOdoStr === null) return;
            const newOdo = parseInt(newOdoStr);
            if (isNaN(newOdo) || newOdo < 0) {
                showToast("Số km không hợp lệ!", "error");
                return;
            }
            let vehicles = DB.get('vehicles');
            const v = vehicles.find(item => item.id === id);
            if (v) {
                v.odo = newOdo;
                DB.set('vehicles', vehicles);
                showToast("Đã cập nhật chỉ số ODO thành công!", "success");
                renderCurrentTabContent();
            }
        }

        function deleteVehicle(id) {
            if (confirm("Bạn có chắc chắn muốn xoá phương tiện này khỏi danh sách?")) {
                let vehicles = DB.get('vehicles').filter(v => v.id !== id);
                DB.set('vehicles', vehicles);
                showToast("Đã xoá phương tiện thành công", "info");
                renderCurrentTabContent();
            }
        }

        // <<Extend>> Xuất CSV chuẩn tiếng Việt (UTF-8 with BOM)
        function exportCSVData() {
            const myVehicles = DB.get('vehicles').filter(v => v.userId === currentUser.id);
            const vehicleIds = myVehicles.map(v => v.id);
            const history = DB.get('history').filter(h => vehicleIds.includes(h.vehicleId));

            if (history.length === 0) {
                showToast("Không có dữ liệu lịch sử để xuất file!", "info");
                return;
            }

            let csvContent = "\uFEFF";
            csvContent += "Mã,Ngày thực hiện,Phương tiện,Biển kiểm soát,Hạng mục,Chi phí (VNĐ),Đơn vị thực hiện,Ghi chú\n";

            history.forEach(h => {
                const v = myVehicles.find(x => x.id === h.vehicleId);
                const vehicleName = v ? v.name : '';
                const vehiclePlate = v ? v.plate : '';
                csvContent += `"${h.id}","${h.date}","${vehicleName}","${vehiclePlate}","${h.serviceName}",${h.cost},"${h.provider || ''}","${h.notes || ''}"\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `BaoCao_BaoDuong_${currentUser.name.replace(/\s+/g, '_')}_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            showToast("Đã xuất file báo cáo CSV thành công!", "success");
        }

                                <input type="number" id="std-price" value="500000" step="50000" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Chu kỳ khuyến nghị (km)</label>
                            <input type="number" id="std-interval" value="10000" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                        </div>
                        <div class="pt-4 flex justify-end space-x-3">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-200 text-sm font-semibold text-slate-600 hover:bg-slate-50">Huỷ</button>
                            <button type="submit" class="px-5 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-sm font-bold">Thêm hạng mục</button>
                        </div>
                    </form>
                </div>
            `);
        }

        function handleCreateService(e) {
            e.preventDefault();
            const name = document.getElementById('std-name').value.trim();
            const category = document.getElementById('std-cat').value;
            const basePrice = parseInt(document.getElementById('std-price').value) || 0;
            const intervalKm = parseInt(document.getElementById('std-interval').value) || 5000;

            const services = DB.get('services');
            services.push({
                id: Date.now(),
                name,
                category,
                basePrice,
                intervalKm
            });
            DB.set('services', services);
            closeModal();
            showToast("Đã thêm quy chuẩn dịch vụ mới!", "success");
            renderCurrentTabContent();
        }

        // Khởi động trang web
        renderApp();
    </script>
</body>
</html>
