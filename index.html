<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PVMIS - Personal Vehicle Maintenance Information System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            200: '#ddd6fe',
                            500: '#8b5cf6',
                            600: '#8b5cf6',
                            700: '#7c3aed',
                            800: '#6d28d9',
                            900: '#4c1d95'
                        }
                    }
                }
            }
        }
    </script>
    <script>
        (() => {
            try {
                const savedTheme = localStorage.getItem('pvmis_theme_v1');
                document.documentElement.dataset.theme = savedTheme === 'light' ? 'light' : 'dark';
            } catch (error) {
                document.documentElement.dataset.theme = 'dark';
            }
        })();
    </script>
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            color-scheme: dark;
            --pvmis-bg: #0b0d14;
            --pvmis-sidebar: #10131d;
            --pvmis-card: #171b28;
            --pvmis-card-raised: #1d2333;
            --pvmis-border: #292f40;
            --pvmis-brand: #8b5cf6;
            --pvmis-brand-secondary: #6366f1;
            --pvmis-text: #f1f5f9;
            --pvmis-muted: #94a3b8;
            --pvmis-success: #22c55e;
            --pvmis-warning: #f59e0b;
            --pvmis-danger: #ef4444;
            --pvmis-input: #10131d;
            --pvmis-table-head: #1b2030;
            --pvmis-auth-brand: #10131d;
        }

        html {
            scroll-behavior: smooth;
            background: var(--pvmis-bg);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            background: var(--pvmis-bg);
        }

        button, input, select, textarea {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        button:focus-visible, a:focus-visible, input:focus-visible,
        select:focus-visible, textarea:focus-visible {
            outline: 3px solid rgb(139 92 246 / 42%);
            outline-offset: 2px;
        }

        #app-root {
            min-width: 0;
        }

        #app-root > div {
            min-width: 0;
        }

        #tab-viewport > * {
            min-width: 0;
        }

        #app-root .pvmis-shell {
            color: var(--pvmis-text);
            background: var(--pvmis-bg) !important;
        }

        #app-root .pvmis-sidebar {
            background: var(--pvmis-sidebar) !important;
            border-right: 1px solid var(--pvmis-border);
        }

        #app-root .pvmis-header,
        #app-root .pvmis-footer {
            color: var(--pvmis-text);
            background: var(--pvmis-sidebar) !important;
            border-color: var(--pvmis-border) !important;
        }

        #app-root .pvmis-mobile-nav {
            background: var(--pvmis-sidebar) !important;
            border-color: var(--pvmis-border) !important;
        }

        #app-root .bg-white,
        #modal-content {
            color: var(--pvmis-text);
            background-color: var(--pvmis-card) !important;
        }

        #app-root .bg-slate-50,
        #app-root .bg-slate-100,
        #app-root .bg-slate-200 {
            background-color: var(--pvmis-card-raised) !important;
        }

        #app-root .text-slate-900,
        #app-root .text-slate-800,
        #app-root .text-slate-700 {
            color: var(--pvmis-text) !important;
        }

        #app-root .text-slate-600,
        #app-root .text-slate-500,
        #app-root .text-slate-400 {
            color: var(--pvmis-muted) !important;
        }

        #app-root .pvmis-image-badge {
            color: #fff !important;
            background-color: rgb(15 23 42 / 92%) !important;
            border: 1px solid rgb(255 255 255 / 30%);
            box-shadow: 0 2px 8px rgb(0 0 0 / 35%);
            text-shadow: 0 1px 2px rgb(0 0 0 / 45%);
        }

        #app-root .pvmis-image-action {
            color: #111827 !important;
            background-color: rgb(248 250 252 / 96%) !important;
        }

        #modal-content .text-slate-900,
        #modal-content .text-slate-800,
        #modal-content .text-slate-700 { color: var(--pvmis-text) !important; }
        #modal-content .text-slate-600,
        #modal-content .text-slate-500,
        #modal-content .text-slate-400 { color: var(--pvmis-muted) !important; }
        #modal-content .bg-slate-50,
        #modal-content .bg-slate-100,
        #modal-content .bg-slate-200 { background-color: var(--pvmis-card-raised) !important; }

        #app-root .border-slate-200,
        #app-root .border-slate-100,
        #app-root .border-slate-300,
        #modal-content .border-slate-200,
        #modal-content .border-slate-100 {
            border-color: var(--pvmis-border) !important;
        }

        #app-root .divide-slate-100 > :not([hidden]) ~ :not([hidden]),
        #app-root .divide-slate-200 > :not([hidden]) ~ :not([hidden]) {
            border-color: var(--pvmis-border) !important;
        }

        #app-root input,
        #app-root select,
        #app-root textarea,
        #modal-content input,
        #modal-content select,
        #modal-content textarea {
            color: var(--pvmis-text);
            background-color: var(--pvmis-input);
            border-color: var(--pvmis-border);
        }

        #app-root input::placeholder,
        #app-root textarea::placeholder,
        #modal-content input::placeholder,
        #modal-content textarea::placeholder {
            color: #64748b;
        }

        #app-root table thead,
        #app-root .bg-slate-50\/80,
        #app-root .hover\:bg-slate-50:hover {
            background-color: var(--pvmis-table-head) !important;
        }

        #app-root .bg-indigo-50,
        #app-root .bg-brand-50 {
            background-color: rgb(139 92 246 / 12%) !important;
        }

        #app-root .bg-blue-50 { background-color: rgb(59 130 246 / 12%) !important; }
        #app-root .bg-emerald-50 { background-color: rgb(34 197 94 / 12%) !important; }
        #app-root .bg-amber-50 { background-color: rgb(245 158 11 / 12%) !important; }
        #app-root .bg-rose-50 { background-color: rgb(239 68 68 / 12%) !important; }
        #app-root .bg-purple-50 { background-color: rgb(168 85 247 / 12%) !important; }

        #app-root .border-rose-200 { border-color: rgb(239 68 68 / 38%) !important; }
        #app-root .border-amber-200 { border-color: rgb(245 158 11 / 38%) !important; }
        #app-root .border-indigo-200,
        #app-root .border-brand-200 { border-color: rgb(139 92 246 / 38%) !important; }

        #app-root .text-indigo-700,
        #app-root .text-brand-700,
        #app-root .text-brand-600,
        #app-root .text-blue-600,
        #app-root .text-purple-700 {
            color: #c4b5fd !important;
        }

        #app-root .text-emerald-600,
        #app-root .text-emerald-700 {
            color: #4ade80 !important;
        }

        #app-root .text-amber-700,
        #app-root .text-amber-800 {
            color: #fbbf24 !important;
        }

        #app-root .text-rose-600,
        #app-root .text-rose-700 {
            color: #fb7185 !important;
        }

        #app-root .shadow-sm,
        #app-root .shadow-md,
        #app-root .shadow-lg,
        #modal-content {
            box-shadow: 0 10px 30px rgb(0 0 0 / 18%);
        }

        #app-root .pvmis-auth {
            background: var(--pvmis-bg) !important;
        }

        #app-root .pvmis-auth-panel {
            background: var(--pvmis-card) !important;
            border-color: var(--pvmis-border) !important;
        }

        #app-root .pvmis-auth-brand {
            background: var(--pvmis-auth-brand) !important;
        }

        html[data-theme="light"] {
            color-scheme: light;
            --pvmis-bg: #f8fafc;
            --pvmis-sidebar: #ffffff;
            --pvmis-card: #ffffff;
            --pvmis-card-raised: #f1f5f9;
            --pvmis-border: #e2e8f0;
            --pvmis-brand: #7c3aed;
            --pvmis-brand-secondary: #6366f1;
            --pvmis-text: #0f172a;
            --pvmis-muted: #64748b;
            --pvmis-success: #16a34a;
            --pvmis-warning: #d97706;
            --pvmis-danger: #dc2626;
            --pvmis-input: #ffffff;
            --pvmis-table-head: #f1f5f9;
            --pvmis-auth-brand: #171b28;
        }

        html[data-theme="light"] #app-root .pvmis-sidebar,
        html[data-theme="light"] #app-root .pvmis-sidebar .text-white {
            color: var(--pvmis-text) !important;
        }

        html[data-theme="light"] #app-root .pvmis-sidebar .bg-violet-600 {
            color: #ffffff !important;
        }

        html[data-theme="light"] #app-root .pvmis-sidebar .bg-white\/5 {
            background-color: #f1f5f9 !important;
        }

        html[data-theme="light"] #app-root .pvmis-sidebar .border-white\/10,
        html[data-theme="light"] #app-root .pvmis-sidebar .border-white\/20 {
            border-color: var(--pvmis-border) !important;
        }

        html[data-theme="light"] #app-root .pvmis-sidebar .bg-violet-500\/15 {
            color: #6d28d9 !important;
            background-color: #f5f3ff !important;
            border-color: #ddd6fe !important;
        }

        html[data-theme="light"] #app-root .pvmis-mobile-nav button:not(.bg-violet-600) {
            color: #475569 !important;
            background-color: #f1f5f9 !important;
        }

        html[data-theme="light"] #app-root #account-menu {
            background-color: #ffffff !important;
            border-color: var(--pvmis-border) !important;
        }

        html[data-theme="light"] #app-root .text-slate-100,
        html[data-theme="light"] #app-root .text-slate-200,
        html[data-theme="light"] #app-root .text-slate-300,
        html[data-theme="light"] #modal-content .text-slate-100,
        html[data-theme="light"] #modal-content .text-slate-200,
        html[data-theme="light"] #modal-content .text-slate-300 {
            color: #334155 !important;
        }

        html[data-theme="light"] #app-root .text-violet-200,
        html[data-theme="light"] #app-root .text-violet-300,
        html[data-theme="light"] #app-root .text-indigo-300,
        html[data-theme="light"] #app-root .text-brand-300,
        html[data-theme="light"] #modal-content .text-violet-200,
        html[data-theme="light"] #modal-content .text-violet-300 {
            color: #6d28d9 !important;
        }

        html[data-theme="light"] #app-root .text-rose-300,
        html[data-theme="light"] #app-root .text-rose-400,
        html[data-theme="light"] #modal-content .text-rose-300 {
            color: #be123c !important;
        }

        html[data-theme="light"] #app-root .text-emerald-300,
        html[data-theme="light"] #app-root .text-emerald-400 {
            color: #15803d !important;
        }

        html[data-theme="light"] #app-root .text-amber-300,
        html[data-theme="light"] #app-root .text-amber-400 {
            color: #b45309 !important;
        }

        /* The auth hero and public footer intentionally stay dark in light mode. */
        html[data-theme="light"] #app-root .pvmis-auth-brand .text-indigo-200,
        html[data-theme="light"] #app-root .pvmis-auth-brand .text-indigo-300,
        html[data-theme="light"] #app-root .pvmis-auth-brand .text-violet-200,
        html[data-theme="light"] #app-root .pvmis-auth-brand .text-violet-300 { color: #c7d2fe !important; }
        html[data-theme="light"] #app-root .pvmis-auth-brand .text-emerald-300,
        html[data-theme="light"] #app-root .pvmis-auth-brand .text-emerald-400 { color: #86efac !important; }
        html[data-theme="light"] #app-root .pvmis-auth-brand .text-amber-300,
        html[data-theme="light"] #app-root .pvmis-auth-brand .text-amber-400 { color: #fcd34d !important; }
        html[data-theme="light"] #app-root .pvmis-auth-brand .text-slate-400,
        html[data-theme="light"] #app-root .pvmis-auth > footer .text-slate-400,
        html[data-theme="light"] #app-root .pvmis-auth > footer .text-slate-500 { color: #cbd5e1 !important; }

        html[data-theme="light"] #app-root .bg-slate-800,
        html[data-theme="light"] #modal-content .bg-slate-800 {
            background-color: #e2e8f0 !important;
        }

        html[data-theme="light"] #app-root .bg-violet-500\/10,
        html[data-theme="light"] #app-root .bg-violet-500\/15 { background-color: #f5f3ff !important; }
        html[data-theme="light"] #app-root .bg-rose-500\/10 { background-color: #fff1f2 !important; }
        html[data-theme="light"] #app-root .bg-emerald-500\/10 { background-color: #f0fdf4 !important; }
        html[data-theme="light"] #app-root .bg-amber-500\/10 { background-color: #fffbeb !important; }

        html[data-theme="light"] #app-root .text-indigo-700,
        html[data-theme="light"] #app-root .text-brand-700,
        html[data-theme="light"] #app-root .text-brand-600,
        html[data-theme="light"] #app-root .text-blue-600,
        html[data-theme="light"] #app-root .text-purple-700 { color: #6d28d9 !important; }
        html[data-theme="light"] #app-root .text-emerald-600,
        html[data-theme="light"] #app-root .text-emerald-700 { color: #15803d !important; }
        html[data-theme="light"] #app-root .text-amber-700,
        html[data-theme="light"] #app-root .text-amber-800 { color: #b45309 !important; }
        html[data-theme="light"] #app-root .text-rose-600,
        html[data-theme="light"] #app-root .text-rose-700 { color: #be123c !important; }

        html[data-theme="light"] #app-root .border-slate-700,
        html[data-theme="light"] #app-root .border-slate-600,
        html[data-theme="light"] #modal-content .border-slate-700 {
            border-color: var(--pvmis-border) !important;
        }

        html[data-theme="light"] #app-root .bg-white\/5:hover,
        html[data-theme="light"] #app-root .hover\:bg-white\/5:hover {
            background-color: #f1f5f9 !important;
        }

        html[data-theme="light"] #app-root .shadow-sm,
        html[data-theme="light"] #app-root .shadow-md,
        html[data-theme="light"] #app-root .shadow-lg,
        html[data-theme="light"] #tab-viewport .bg-white.rounded-2xl,
        html[data-theme="light"] #tab-viewport .bg-white.border,
        html[data-theme="light"] #modal-content {
            box-shadow: 0 8px 24px rgb(15 23 42 / 7%);
        }

        html[data-theme="light"] #app-root .pvmis-auth-brand {
            color: #f1f5f9 !important;
        }

        #tab-viewport .bg-white.rounded-2xl,
        #tab-viewport .bg-white.border {
            box-shadow: 0 10px 30px rgb(0 0 0 / 14%);
        }

        #tab-viewport button,
        #app-root button {
            transition: color 160ms ease, background-color 160ms ease,
                border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
        }

        #tab-viewport button:active,
        #app-root button:active {
            transform: translateY(1px);
        }

        #modal-container {
            overscroll-behavior: contain;
        }

        #modal-content {
            box-shadow: 0 24px 80px rgb(0 0 0 / 55%);
        }

        #toast-container {
            width: min(24rem, calc(100vw - 2rem));
        }

        #toast-container > div {
            max-width: 100%;
            overflow-wrap: anywhere;
            color: var(--pvmis-text);
            background: var(--pvmis-card) !important;
            border-color: var(--pvmis-border) !important;
        }

        #toast-container .text-slate-700 { color: var(--pvmis-text) !important; }

        .pvmis-sidebar {
            position: sticky;
            top: 0;
            align-self: flex-start;
            height: 100vh;
            height: 100dvh;
            min-height: 0;
            overflow: hidden;
        }

        .pvmis-sidebar-nav {
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
        }

        .pvmis-sidebar-footer {
            flex: 0 0 auto;
        }

        @media (max-height: 620px) {
            .pvmis-sidebar {
                overflow-y: auto;
            }
        }

        .pvmis-mobile-nav {
            scrollbar-width: none;
            overscroll-behavior-x: contain;
        }

        .pvmis-mobile-nav::-webkit-scrollbar {
            display: none;
        }

        #tab-viewport .overflow-x-auto {
            -webkit-overflow-scrolling: touch;
        }

        #tab-viewport table {
            min-width: 700px;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1d2333;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 9999px;
        }

        @media (max-width: 767px) {
            #tab-viewport table {
                min-width: 640px;
            }

            #modal-container {
                align-items: flex-end;
                padding: 0.75rem;
            }

            #modal-content {
                max-height: min(88dvh, 48rem);
                border-radius: 1.25rem;
            }

            #app-root .pvmis-header {
                padding-left: 1rem;
                padding-right: 1rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

        const PASSWORD_HASH_ITERATIONS = 600000;
        let passwordMigrationPromise = null;

        function encodeBase64(bytes) {
            let binary = '';
            bytes.forEach(byte => { binary += String.fromCharCode(byte); });
            return btoa(binary);
        }

        function decodeBase64(value) {
            const binary = atob(value);
            return Uint8Array.from(binary, char => char.charCodeAt(0));
        }

        function passwordCryptoAvailable() {
            return Boolean(globalThis.crypto && globalThis.crypto.subtle && globalThis.crypto.getRandomValues && globalThis.TextEncoder);
        }

        async function createPasswordRecord(password, saltValue = null, iterations = PASSWORD_HASH_ITERATIONS) {
            if (!passwordCryptoAvailable()) throw new Error('Web Crypto không khả dụng.');
            const salt = saltValue ? decodeBase64(saltValue) : globalThis.crypto.getRandomValues(new Uint8Array(16));
            const material = await globalThis.crypto.subtle.importKey(
                'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']
            );
            const digest = await globalThis.crypto.subtle.deriveBits({
                name: 'PBKDF2', salt, iterations, hash: 'SHA-256'
            }, material, 256);
            return {
                passHash: encodeBase64(new Uint8Array(digest)),
                passSalt: encodeBase64(salt),
                passIterations: iterations
            };
        }

        function constantTimeEquals(left, right) {
            if (typeof left !== 'string' || typeof right !== 'string' || left.length !== right.length) return false;
            let mismatch = 0;
            for (let index = 0; index < left.length; index++) mismatch |= left.charCodeAt(index) ^ right.charCodeAt(index);
            return mismatch === 0;
        }

        async function verifyUserPassword(user, password) {
            if (user.passHash && user.passSalt) {
                const computed = await createPasswordRecord(password, user.passSalt, Number(user.passIterations) || PASSWORD_HASH_ITERATIONS);
                return constantTimeEquals(computed.passHash, user.passHash);
            }
            return Object.prototype.hasOwnProperty.call(user, 'pass') && user.pass === password;
        }

        async function migrateLegacyPasswords() {
            if (!passwordCryptoAvailable()) throw new Error('Web Crypto không khả dụng.');
            const users = DB.get('users');
            let changed = false;
            for (const user of users) {
                if (Object.prototype.hasOwnProperty.call(user, 'pass') && user.passHash) {
                    delete user.pass;
                    changed = true;
                } else if (Object.prototype.hasOwnProperty.call(user, 'pass') && !user.passHash) {
                    const record = await createPasswordRecord(String(user.pass));
                    Object.assign(user, record);
                    delete user.pass;
                    changed = true;
                }
            }
            if (changed) DB.set('users', users);
        }

        function ensurePasswordMigration() {
            if (!passwordMigrationPromise) {
                passwordMigrationPromise = migrateLegacyPasswords();
            }
            return passwordMigrationPromise;

                    let sourceHTML = root.innerHTML.replace(/<(span|textarea|option)\b[^>]*data-pvmis-no-translate="true"[^>]*>[\s\S]*?<\/\1>/gi, markup => {
                        const token = `__PVMIS_USER_TEXT_${preserved.length}__`;
                        preserved.push(markup);
                        return token;
                    });
                    sourceHTML = sourceHTML.replace(/(<textarea\b[^>]*data-pvmis-no-translate-content="true"[^>]*>)([\s\S]*?)(<\/textarea>)/gi, (match, openTag, value, closeTag) => {
                        const token = `__PVMIS_USER_TEXT_${preserved.length}__`;
                        preserved.push(value);
                        return `${openTag}${token}${closeTag}`;
                    });
                    root.innerHTML = translateText(sourceHTML);
                    preserved.forEach((markup, index) => {
                        root.innerHTML = root.innerHTML.replace(`__PVMIS_USER_TEXT_${index}__`, markup);
                    });
                }
                if (root.dataset) root.dataset.pvmisLanguage = currentLanguage;
                return;
            }
            const visit = node => {
                if (node.nodeType === 3) {
                    node.nodeValue = translateText(node.nodeValue);
                    return;
                }
                if (node.nodeType === 1 && node.dataset && node.dataset.pvmisLanguage === currentLanguage) return;
                const isUserData = node.nodeType === 1 && node.dataset && node.dataset.pvmisNoTranslate === 'true';
                const preserveChildText = isUserData || (node.nodeType === 1 && node.dataset && node.dataset.pvmisNoTranslateContent === 'true');
                if (node.nodeType === 1 && node.attributes && !isUserData) {
                    for (const attribute of ['placeholder', 'title', 'aria-label', 'alt']) {
                        const value = node.getAttribute(attribute);
                        if (value) node.setAttribute(attribute, translateText(value));
                    }
                }
                if (!preserveChildText && node.childNodes) {
                    Array.from(node.childNodes).forEach(visit);
                }
                if (node.nodeType === 1 && node.dataset) node.dataset.pvmisLanguage = currentLanguage;
            };
            visit(root);
        }

        function renderCurrentTabContent() {
            const viewport = document.getElementById('tab-viewport');

            if (viewport.dataset) delete viewport.dataset.pvmisLanguage;
             if (currentTab === 'dashboard') {
                renderDashboardTab(viewport);
                localizeSubtree(viewport);
                return;
            }

            if (currentTab === 'vehicles') renderVehiclesTab(viewport);
            else if (currentTab === 'schedules') renderSchedulesTab(viewport);
            else if (currentTab === 'history') renderHistoryTab(viewport);

        async function handleAuthSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value.trim();
            const pass = document.getElementById('auth-pass').value;

            let migrationError = null;
            try { await ensurePasswordMigration(); } catch (error) { migrationError = error; }
            const users = DB.get('users');
            const user = users.find(u => u.email.toLowerCase() === email.toLowerCase());
            let validPassword = false;
            try { validPassword = user ? await verifyUserPassword(user, pass) : false; }
            catch (error) {
                showToast(migrationError ? 'Không thể xác minh mật khẩu trên trình duyệt này.' : 'Không thể xác minh mật khẩu. Hãy thử lại.', 'error');
                return;
            }
            if (user && validPassword) {
                currentUser = publicUser(user);
                sessionStorage.setItem('pvmis_currentUser_v4', JSON.stringify(currentUser));
                currentTab = user.role === 'admin' ? 'admin' : 'dashboard';
                appSearchQuery = '';
                showToast(`Chào mừng bạn ${user.name} đã đăng nhập!`, 'success');
                renderApp();
            } else {
                showToast(migrationError && user && user.passHash ? 'Không thể xác minh mật khẩu trên trình duyệt này.' : "Email hoặc mật khẩu không chính xác!", "error");
            }
        }

        async function handleRegisterSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const pass = document.getElementById('reg-pass').value;

            if (pass.length < 8) {
                showToast("Mật khẩu phải từ 8 ký tự trở lên!", "error");
                return;
            }

            const users = DB.get('users');
            if (users.find(u => u.email.toLowerCase() === email.toLowerCase())) {
                showToast("Email này đã được sử dụng, vui lòng chọn email khác!", "error");
                return;
            }

            if (!passwordCryptoAvailable()) {
                showToast('Trình duyệt không hỗ trợ lưu mật khẩu an toàn. Hãy mở ứng dụng trong trình duyệt hiện đại.', 'error');
                return;
            }
            let newUser;
            try {
                newUser = {
                    id: Date.now(),
                    name: name,
                    email: email,
                    ...(await createPasswordRecord(pass)),
                    role: 'owner',
                    avatar: `https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(name)}&backgroundColor=b6e3f4`
                };
            } catch (error) {
                showToast('Không thể tạo mật khẩu bảo vệ. Vui lòng thử lại trên trình duyệt hiện đại.', 'error');
                return;
            }

            users.push(newUser);
            DB.set('users', users);

            currentUser = publicUser(newUser);
            sessionStorage.setItem('pvmis_currentUser_v4', JSON.stringify(currentUser));
            currentTab = 'dashboard';
            appSearchQuery = '';
            showToast("Đăng ký tài khoản thành công!", "success");
            renderApp();
        }

        function handleAccountUpdate(e) {
            e.preventDefault();
            if (!currentUser) return;
            const users = DB.get('users');
            const user = users.find(item => item.id === currentUser.id);
            if (!user) return;
            const name = document.getElementById('profile-name').value.trim();
            const email = document.getElementById('profile-email').value.trim();
            if (users.some(item => item.id !== user.id && item.email.toLowerCase() === email.toLowerCase())) {
                showToast('Email này đã được tài khoản khác sử dụng.', 'error');
                return;
            }
            user.name = name;
            user.email = email;
            user.avatar = `https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(name)}&backgroundColor=b6e3f4`;
            DB.set('users', users);
            currentUser = publicUser(user);
            sessionStorage.setItem('pvmis_currentUser_v4', JSON.stringify(currentUser));
            closeModal();
            showToast('Đã cập nhật thông tin cá nhân.', 'success');
            renderApp();
        }

                        <div class="flex justify-end gap-3 border-t border-slate-700 pt-4"><button type="button" onclick="closeModal()" class="rounded-xl border border-slate-700 px-4 py-2 text-sm font-semibold text-slate-300 hover:bg-white/5">Hủy</button><button type="submit" class="rounded-xl bg-violet-600 px-5 py-2 text-sm font-bold text-white hover:bg-violet-700">Cập nhật mật khẩu</button></div>

        async function handleChangePassword(e) {
            e.preventDefault();
            if (!currentUser) return;
            const currentPassword = document.getElementById('password-current').value;
            const newPassword = document.getElementById('password-new').value;
            const confirmPassword = document.getElementById('password-confirm').value;
            if (newPassword.length < 8) return showToast('Mật khẩu mới phải có ít nhất 8 ký tự.', 'error');
            if (newPassword !== confirmPassword) return showToast('Mật khẩu xác nhận chưa khớp.', 'error');
            if (currentPassword === newPassword) return showToast('Mật khẩu mới phải khác mật khẩu hiện tại.', 'error');
            if (!passwordCryptoAvailable()) return showToast('Trình duyệt không hỗ trợ lưu mật khẩu an toàn.', 'error');
            const users = DB.get('users');
            const user = users.find(item => item.id === currentUser.id);
            if (!user || !(await verifyUserPassword(user, currentPassword))) return showToast('Mật khẩu hiện tại không chính xác.', 'error');
            try {
                Object.assign(user, await createPasswordRecord(newPassword));
                delete user.pass;
                DB.set('users', users);
                closeModal();
                showToast('Đã đổi mật khẩu thành công.', 'success');
            } catch (error) {
                showToast('Không thể đổi mật khẩu. Vui lòng thử lại.', 'error');
            }
        }

            showToast("Đã đăng xuất an toàn khỏi hệ thống", "info");
            renderApp();
        }

                <h3 class="font-bold text-slate-700">${allMyVehicles.length ? 'Không tìm thấy phương tiện phù hợp' : 'Chưa có phương tiện nào'}</h3>
                <p class="text-slate-400 text-sm mt-1">${allMyVehicles.length ? 'Thử tìm bằng tên xe, biển số hoặc loại phương tiện.' : 'Bấm nút “Thêm xe mới” ở trên để đưa xe vào quản lý.'}</p>

                                        <i class="fa-solid fa-pen"></i><span>Chỉnh sửa</span>

                                        <i class="fa-solid fa-gauge-high"></i><span>Cập nhật ODO</span>

                                    <button onclick="deleteVehicle(${v.id})" class="rounded-lg border border-rose-100 bg-rose-50 px-2.5 py-2 text-rose-600 hover:bg-rose-100 font-bold text-xs inline-flex items-center justify-center gap-1.5">
                                        <i class="fa-regular fa-trash-can"></i><span>Xoá xe</span>

                            </div>

                }).join('')}

        function openEditVehicleModal(id) {
            const vehicle = DB.get('vehicles').find(v => v.id === id && v.userId === currentUser.id);
            if (!vehicle) {
                showToast("Không tìm thấy phương tiện cần chỉnh sửa.", "error");
                return;
            }

            const vehicleTypes = ['Xe máy', 'Xe côn tay', 'Ô tô', 'Ô tô SUV', 'Ô tô điện'];
            if (!vehicleTypes.includes(vehicle.type)) vehicleTypes.push(vehicle.type);

            openModal(`
                <div class="p-6">
                    <div class="flex justify-between items-center pb-4 border-b border-slate-100">
                        <div>
                            <p class="text-xs font-bold uppercase tracking-wider text-brand-600">Hồ sơ phương tiện</p>
                            <h3 class="font-black text-lg text-slate-900 mt-1">Chỉnh sửa ${preserveUserText(vehicle.name)}</h3>
                        </div>
                        <button type="button" onclick="closeModal()" aria-label="Đóng" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                    </div>
                    <form onsubmit="handleUpdateVehicle(event, ${vehicle.id})" class="space-y-4 mt-4">
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Tên xe / Model *</label>
                            <input type="text" id="veh-name" required value="${escapeHTML(vehicle.name)}" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Biển kiểm soát *</label>
                                <input type="text" id="veh-plate" required value="${escapeHTML(vehicle.plate)}" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Loại phương tiện</label>
                                <select id="veh-type" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none bg-white">
                                    ${vehicleTypes.map(type => `<option value="${escapeHTML(type)}" ${vehicle.type === type ? 'selected' : ''}>${escapeHTML(type)}</option>`).join('')}

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">

                            </div>

                                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Năm sản xuất</label>
                                <input type="number" id="veh-year" value="${vehicle.year || ''}" min="1900" max="2100" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">

        function handleUpdateVehicle(e, id) {
            e.preventDefault();
            const vehicles = DB.get('vehicles');
            const vehicle = vehicles.find(v => v.id === id && v.userId === currentUser.id);
            if (!vehicle) {
                showToast("Không tìm thấy phương tiện cần cập nhật.", "error");
                return;
            }

            const name = document.getElementById('veh-name').value.trim();
            const plate = document.getElementById('veh-plate').value.trim();
            const type = document.getElementById('veh-type').value;
            const odo = parseInt(document.getElementById('veh-odo').value) || 0;
            const year = parseInt(document.getElementById('veh-year').value) || vehicle.year || 2023;
            const imageInput = document.getElementById('veh-img').value.trim();

            if (odo < (Number(vehicle.odo) || 0)) {
                showToast("ODO mới không thể thấp hơn chỉ số hiện tại.", "error");
                return;
            }

            vehicle.name = name;
            vehicle.plate = plate;
            vehicle.type = type;
            vehicle.odo = odo;
            vehicle.year = year;
            vehicle.image = imageInput || (type.includes('Ô tô') ? FALLBACK_CAR_IMG : FALLBACK_MOTO_IMG);

            DB.set('vehicles', vehicles);
            closeModal();
            showToast(`Đã cập nhật phương tiện ${name}!`, "success");
            renderCurrentTabContent();
        }

        function viewVehicleDetails(id) {
            const vehicle = DB.get('vehicles').find(v => v.id === id && v.userId === currentUser.id);
            if (!vehicle) {
                showToast("Không tìm thấy phương tiện.", "error");
                return;
            }

            const fallbackImg = vehicle.type.includes('Ô tô') ? FALLBACK_CAR_IMG : FALLBACK_MOTO_IMG;
            const schedules = DB.get('schedules')
                .filter(s => s.vehicleId === vehicle.id && s.status === 'pending')
                .sort((a, b) => new Date(a.date) - new Date(b.date));
            const history = DB.get('history')
                .filter(h => h.vehicleId === vehicle.id)
                .sort((a, b) => new Date(b.date) - new Date(a.date));

            openModal(`
                <div>

        function handleCreateVehicle(e) {
            e.preventDefault();
            const name = document.getElementById('veh-name').value.trim();
            const plate = document.getElementById('veh-plate').value.trim();
            const type = document.getElementById('veh-type').value;
            const odo = parseInt(document.getElementById('veh-odo').value) || 0;
            const year = parseInt(document.getElementById('veh-year').value) || 2023;
            let image = document.getElementById('veh-img').value.trim();

            if (odo < 0) {
                showToast("Số ODO không thể âm.", "error");
                return;
            }

            if (!image) {
                image = type.includes('Ô tô') ? FALLBACK_CAR_IMG : FALLBACK_MOTO_IMG;
            }

            const vehicles = DB.get('vehicles');
            vehicles.push({
                id: Date.now(),
                userId: currentUser.id,
                name,
                plate,
                type,
                odo,
                year,
                image
            });
            DB.set('vehicles', vehicles);
            closeModal();
            showToast(`Đã thêm thành công xe ${name}!`, "success");
            renderCurrentTabContent();
        }

        function updateVehicleOdo(id, currentOdo) {
            const newOdoStr = prompt(translateText("Cập nhật số km (ODO) mới nhất của xe:"), currentOdo);
            if (newOdoStr === null) return;
            const newOdo = parseInt(newOdoStr);
            if (isNaN(newOdo) || newOdo < 0) {
                showToast("Số km không hợp lệ!", "error");
                return;
            }
            let vehicles = DB.get('vehicles');
            const v = vehicles.find(item => item.id === id && item.userId === currentUser.id);
            if (v) {
                if (newOdo < (Number(v.odo) || 0)) {
                    showToast("ODO mới không thể thấp hơn chỉ số hiện tại.", "error");
                    return;
                }
                v.odo = newOdo;
                DB.set('vehicles', vehicles);
                showToast("Đã cập nhật chỉ số ODO thành công!", "success");
                renderCurrentTabContent();
            }
        }

        function deleteVehicle(id) {
            const vehicle = DB.get('vehicles').find(v => v.id === id && v.userId === currentUser.id);
            if (!vehicle) return;
            if (!confirm(translateText(`Xóa ${vehicle.name} cùng toàn bộ lịch bảo dưỡng và lịch sử liên quan? Thao tác này không thể hoàn tác.`))) return;

            DB.set('vehicles', DB.get('vehicles').filter(v => v.id !== id));
            DB.set('schedules', DB.get('schedules').filter(s => s.vehicleId !== id));
            DB.set('history', DB.get('history').filter(h => h.vehicleId !== id));
            showToast("Đã xóa phương tiện cùng dữ liệu bảo dưỡng liên quan.", "info");
            renderCurrentTabContent();
        }

        /**
         * 6. USE CASE 04: QUẢN LÝ LỊCH BẢO DƯỠNG & <<EXTEND>> HOÀN TẤT
         */
        function renderSchedulesTab(el) {

                .filter(s => vehicleIds.includes(s.vehicleId))
                .sort((a, b) => {
                    if (a.status !== b.status) return a.status === 'pending' ? -1 : 1;
                    return new Date(a.date) - new Date(b.date);
                });
            const todayForSchedules = new Date();
            todayForSchedules.setHours(0, 0, 0, 0);
            const pendingScheduleCount = schedules.filter(s => s.status === 'pending').length;
            const completedScheduleCount = schedules.filter(s => s.status === 'completed').length;
            const overdueScheduleCount = schedules.filter(s => {
                const date = new Date(`${s.date}T00:00:00`);
                return s.status === 'pending' && !isNaN(date) && date < todayForSchedules;
            }).length;

            el.innerHTML = `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">

                            <span class="rounded-lg bg-rose-500/10 px-2.5 py-1 text-rose-300">${localizedCount(overdueScheduleCount, 'quá hạn', 'overdue', 'overdue')}</span>
                            <span class="rounded-lg bg-emerald-500/10 px-2.5 py-1 text-emerald-300">${localizedCount(completedScheduleCount, 'hoàn thành', 'completed', 'completed')}</span>
                        </div>
                    </div>
                    <button onclick="openAddScheduleModal()" class="inline-flex items-center space-x-2 bg-brand-600 hover:bg-brand-700 text-white px-4 py-2.5 rounded-xl text-sm font-bold shadow-md shadow-brand-500/20 transition">
                        <i class="fa-solid fa-calendar-plus"></i>
                        <span>Đặt lịch bảo dưỡng</span>
                    </button>
                </div>

                <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase text-[11px] tracking-wider font-bold">
                                <tr>
                                    <th class="p-4">Phương tiện</th>
                                    <th class="p-4">Hạng mục cần làm</th>
                                    <th class="p-4">Ngày dự kiến</th>
                                    <th class="p-4">Trạng thái</th>
                                    <th class="p-4">Dự toán chi phí</th>
                                    <th class="p-4">Địa điểm / Gara</th>
                                    <th class="p-4 text-right">Hành động</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                ${schedules.length === 0 ? `
                                    <tr>
                                        <td colspan="7" class="p-8 text-center text-slate-400 font-medium">
                                            <i class="fa-solid fa-mug-hot text-2xl mb-2 text-slate-300 block"></i>
                                            Chưa có lịch bảo dưỡng. Tạo lịch mới để bắt đầu theo dõi.
                                        </td>
                                    </tr>
                                ` : schedules.map(s => {
                                    const v = myVehicles.find(item => item.id === s.vehicleId);
                                    const scheduleDate = new Date(`${s.date}T00:00:00`);
                                    const isCompleted = s.status === 'completed';
                                    const isOverdue = !isCompleted && !isNaN(scheduleDate) && scheduleDate < todayForSchedules;
                                    const statusLabel = isCompleted ? 'Đã hoàn thành' : isOverdue ? 'Quá hạn' : 'Đang chờ';
                                    const statusClasses = isCompleted ? 'bg-emerald-500/10 text-emerald-300' : isOverdue ? 'bg-rose-500/10 text-rose-300' : 'bg-violet-500/10 text-violet-300';
                                    return `
                                        <tr class="hover:bg-slate-50/80 transition ${isOverdue ? 'bg-rose-500/[0.025]' : ''}">
                                            <td class="p-4">
                                                <div class="font-bold text-slate-900">${v ? preserveUserText(v.name) : 'Xe không xác định'}</div>
                                                <div class="text-xs text-slate-400 font-semibold">${v ? preserveUserText(v.plate) : ''}</div>
                                            </td>
                                            <td class="p-4">
                                                <span class="font-semibold text-slate-800">${displayStoredText(s.serviceName)}</span>
                                                ${s.notes ? `<p class="text-xs text-slate-400 mt-0.5">${displayStoredText(s.notes)}</p>` : ''}
                                            </td>
                                            <td class="p-4">
                                                <span class="inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-bold ${isOverdue ? 'bg-rose-50 text-rose-700 border border-rose-200' : 'bg-indigo-50 text-indigo-700 border border-indigo-200'}">

                                                    <button onclick="completeScheduleFlow(${s.id})" class="inline-flex items-center space-x-1.5 bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-sm transition">
                                                        <i class="fa-solid fa-check"></i>
                                                        <span>Hoàn tất</span>
                                                    </button>` : `<span class="text-xs text-slate-500">Đã lưu sổ</span>`}
                                                    <button onclick="deleteSchedule(${s.id})" title="${currentLanguage === 'en' ? 'Delete Schedule' : 'Xóa lịch'}" aria-label="${currentLanguage === 'en' ? 'Delete Schedule' : 'Xóa lịch'}" class="rounded-lg border border-rose-500/20 px-2 py-1.5 text-rose-300 hover:bg-rose-500/10"><i class="fa-regular fa-trash-can"></i></button>

                                    `;

                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function openEditScheduleModal(id) {
            if (!currentUser || currentUser.role !== 'owner') return;

            const myVehicles = DB.get('vehicles').filter(item => item.userId === currentUser.id);

                    <form onsubmit="handleUpdateSchedule(event, ${schedule.id})" class="mt-5 space-y-4">
                        <div><label for="sch-edit-vehicle" class="mb-1 block text-xs font-bold uppercase tracking-wider text-slate-400">Phương tiện</label><select id="sch-edit-vehicle" class="w-full rounded-xl border px-3.5 py-2.5 text-sm">${myVehicles.map(v => `<option data-pvmis-no-translate="true" value="${v.id}" ${v.id === schedule.vehicleId ? 'selected' : ''}>${escapeHTML(v.name)} (${escapeHTML(v.plate)})</option>`).join('')}</select></div>
                        <div><label for="sch-edit-service" class="mb-1 block text-xs font-bold uppercase tracking-wider text-slate-400">Hạng mục</label><input id="sch-edit-service" required maxlength="120" value="${escapeHTML(schedule.serviceName)}" class="w-full rounded-xl border px-3.5 py-2.5 text-sm"></div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3"><div><label for="sch-edit-date" class="mb-1 block text-xs font-bold uppercase tracking-wider text-slate-400">Ngày dự kiến</label><input id="sch-edit-date" type="date" required value="${escapeHTML(schedule.date)}" class="w-full rounded-xl border px-3.5 py-2.5 text-sm"></div><div><label for="sch-edit-cost" class="mb-1 block text-xs font-bold uppercase tracking-wider text-slate-400">Dự toán (VNĐ)</label><input id="sch-edit-cost" type="number" min="0" required value="${Number(schedule.cost) || 0}" class="w-full rounded-xl border px-3.5 py-2.5 text-sm"></div></div>
                        <div><label for="sch-edit-location" class="mb-1 block text-xs font-bold uppercase tracking-wider text-slate-400">Địa điểm / Gara</label><input id="sch-edit-location" maxlength="120" value="${escapeHTML(schedule.location || '')}" class="w-full rounded-xl border px-3.5 py-2.5 text-sm"></div>
                        <div><label for="sch-edit-note" class="mb-1 block text-xs font-bold uppercase tracking-wider text-slate-400">Ghi chú</label><textarea id="sch-edit-note" data-pvmis-no-translate="true" rows="3" maxlength="500" class="w-full rounded-xl border px-3.5 py-2.5 text-sm">${escapeHTML(schedule.notes || '')}</textarea></div>
                        <div class="flex justify-end gap-3 border-t border-slate-700 pt-4"><button type="button" onclick="closeModal()" class="rounded-xl border border-slate-700 px-4 py-2 text-sm font-semibold text-slate-300 hover:bg-white/5">Hủy</button><button type="submit" class="rounded-xl bg-violet-600 px-5 py-2 text-sm font-bold text-white hover:bg-violet-700">Lưu lịch</button></div>
                    </form>
                </div>
            `);
        }

        function handleUpdateSchedule(e, id) {
            e.preventDefault();
            if (!currentUser || currentUser.role !== 'owner') return;
            const schedules = DB.get('schedules');
            const schedule = schedules.find(item => item.id === id);
            const vehicleId = Number(document.getElementById('sch-edit-vehicle').value);
            const ownedVehicle = DB.get('vehicles').some(v => v.id === vehicleId && v.userId === currentUser.id);
            if (!schedule || schedule.status === 'completed' || !ownedVehicle) return showToast('Không thể cập nhật lịch này.', 'error');
            const serviceName = document.getElementById('sch-edit-service').value.trim();
            const date = document.getElementById('sch-edit-date').value;
            const cost = Number(document.getElementById('sch-edit-cost').value);
            if (!serviceName || !/^\d{4}-\d{2}-\d{2}$/.test(date) || !Number.isFinite(cost) || cost < 0) return showToast('Vui lòng kiểm tra hạng mục, ngày và chi phí.', 'error');
            schedule.vehicleId = vehicleId;
            schedule.serviceName = serviceName;
            schedule.date = date;
            schedule.cost = cost;
            schedule.location = document.getElementById('sch-edit-location').value.trim();
            schedule.notes = document.getElementById('sch-edit-note').value.trim();
            DB.set('schedules', schedules);
            closeModal();
            showToast('Đã cập nhật lịch bảo dưỡng.', 'success');
            renderCurrentTabContent();
        }

        function deleteSchedule(id) {
            if (!currentUser || currentUser.role !== 'owner') return;
            const schedules = DB.get('schedules');
            const schedule = schedules.find(item => item.id === id);
            const ownedVehicle = schedule && DB.get('vehicles').some(v => v.id === schedule.vehicleId && v.userId === currentUser.id);
            if (!schedule || !ownedVehicle) return;
            const keepsHistory = schedule.status === 'completed';
            const message = keepsHistory
                ? `Xóa lịch “${schedule.serviceName}”? Bản ghi bảo dưỡng trong lịch sử sẽ được giữ lại.`
                : `Xóa lịch “${schedule.serviceName}”? Thao tác này không thể hoàn tác.`;
            if (!confirm(translateText(message))) return;
            DB.set('schedules', schedules.filter(item => item.id !== id));
            showToast('Đã xóa lịch bảo dưỡng.', 'info');
            renderCurrentTabContent();
        }

        function handleCreateSchedule(e) {
            e.preventDefault();
            if (!currentUser || currentUser.role !== 'owner') return;
            const vehicleId = parseInt(document.getElementById('sch-vehicle').value);
            const serviceName = document.getElementById('sch-service').value.trim();
            const date = document.getElementById('sch-date').value;
            const cost = parseInt(document.getElementById('sch-cost').value) || 0;
            const location = document.getElementById('sch-location').value.trim();
            const notes = document.getElementById('sch-note').value.trim();
            const ownedVehicle = DB.get('vehicles').some(v => v.id === vehicleId && v.userId === currentUser.id);
            if (!ownedVehicle || !serviceName || !/^\d{4}-\d{2}-\d{2}$/.test(date) || cost < 0) {
                showToast('Vui lòng kiểm tra phương tiện, hạng mục, ngày và chi phí.', 'error');
                return;
            }

            const schedules = DB.get('schedules');
            schedules.push({
                id: Date.now(),
                vehicleId,
                serviceName,
                date,
                cost,
                location,
                notes,
                status: 'pending'
            });
            DB.set('schedules', schedules);
            closeModal();
            showToast("Đã lên lịch bảo dưỡng thành công!", "success");
            renderCurrentTabContent();
        }

        function completeScheduleFlow(id) {
            if (!currentUser || currentUser.role !== 'owner') return;
            const schedules = DB.get('schedules');
            const item = schedules.find(s => s.id === id);
            const vehicle = item && DB.get('vehicles').find(v => v.id === item.vehicleId && v.userId === currentUser.id);
            if (!item || !vehicle || currentUser.role !== 'owner') return;
            if (item.status === 'completed') {
                showToast("Lịch này đã hoàn thành và được lưu vào lịch sử.", "info");
                return;
            }

            openModal(`
                <div class="p-6">
                    <div class="flex justify-between items-center pb-4 border-b border-slate-100">
                        <div class="flex items-center space-x-2 text-emerald-600">
                            <i class="fa-solid fa-circle-check text-xl"></i>
                            <h3 class="font-black text-lg text-slate-900">Xác Nhận Hoàn Tất Bảo Dưỡng</h3>
                        </div>
                        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                    </div>
                    <form onsubmit="handleFinishSchedule(event, ${id})" class="space-y-4 mt-4">
                        <div class="bg-slate-50 p-3.5 rounded-xl text-xs space-y-1 text-slate-600">
                            <p>Hạng mục: <b class="text-slate-800">${displayStoredText(item.serviceName)}</b></p>
                            <p>Dự toán ban đầu: <b class="text-slate-800">${formatVND(item.cost)}</b></p>
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Chi phí thực tế thanh toán (VNĐ) *</label>
                            <input type="number" id="comp-cost" required value="${item.cost}" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none font-bold text-rose-600">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Ngày hoàn thành thực tế</label>
                            <input type="date" id="comp-date" required value="${new Date().toISOString().split('T')[0]}" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">ODO tại thời điểm bảo dưỡng (km)</label>
                            <input type="number" id="comp-odo" min="${Number(vehicle.odo) || 0}" value="${Number(vehicle.odo) || ''}" placeholder="Nhập số ODO nếu có" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                            <p class="mt-1 text-[11px] text-slate-500">Không thể giảm ODO hiện tại của phương tiện.</p>
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Đơn vị / Gara thực hiện</label>
                            <input type="text" id="comp-provider" value="${escapeHTML(item.location || (currentLanguage === 'en' ? 'Authorized Service Center' : 'Gara chính hãng'))}" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Ghi chú & Bảo hành phụ tùng</label>
                            <textarea id="comp-note" data-pvmis-no-translate-content="true" rows="2" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none" placeholder="Đã hoàn thành phụ tùng, kiểm tra đạt chuẩn...">${escapeHTML(item.notes || '')}</textarea>
                        </div>
                        <div class="pt-4 flex justify-end space-x-3">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-200 text-sm font-semibold text-slate-600 hover:bg-slate-50">Đóng</button>
                            <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold shadow-md shadow-emerald-500/20">Lưu vào Sổ Lịch Sử</button>
                        </div>
                    </form>
                </div>
            `);
        }

        function handleFinishSchedule(e, scheduleId) {
            e.preventDefault();
            if (!currentUser || currentUser.role !== 'owner') return;
            const schedules = DB.get('schedules');
            const item = schedules.find(s => s.id === scheduleId);
            if (!item) return;
            if (item.status === 'completed') {
                closeModal();
                showToast("Lịch này đã được hoàn tất trước đó.", "info");
                renderCurrentTabContent();
                return;
            }

            const cost = parseInt(document.getElementById('comp-cost').value) || 0;
            const date = document.getElementById('comp-date').value;
            const provider = document.getElementById('comp-provider').value.trim();
            const notes = document.getElementById('comp-note').value.trim();
            const odoRaw = document.getElementById('comp-odo').value;
            const vehicle = DB.get('vehicles').find(v => v.id === item.vehicleId && v.userId === currentUser.id);
            if (!vehicle || currentUser.role !== 'owner') return showToast('Không thể cập nhật dữ liệu phương tiện này.', 'error');
            if (cost < 0 || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return showToast('Vui lòng kiểm tra ngày hoàn thành và chi phí.', 'error');
            const odo = odoRaw === '' ? null : Number(odoRaw);
            if (odo !== null && (!Number.isFinite(odo) || odo < (Number(vehicle.odo) || 0))) {
                showToast('ODO không được nhỏ hơn chỉ số hiện tại.', 'error');
                return;
            }

            item.status = 'completed';
            DB.set('schedules', schedules);

            if (odo !== null) {
                const vehicles = DB.get('vehicles');
                const currentVehicle = vehicles.find(v => v.id === vehicle.id);
                currentVehicle.odo = odo;
                DB.set('vehicles', vehicles);
            }

            const history = DB.get('history');
            history.unshift({
                id: Date.now(),
                vehicleId: item.vehicleId,
                serviceName: item.serviceName,
                date: date,
                cost: cost,
                provider: provider,
                notes: notes,
                ...(odo !== null ? { odo } : {})
            });
            DB.set('history', history);

            closeModal();
            showToast("Bảo dưỡng đã hoàn tất và được ghi vào sổ theo dõi!", "success");
            renderCurrentTabContent();
        }

        /**
         * 7. USE CASE 03: NHẬT KÝ & LỊCH SỬ BẢO DƯỠNG (MAINTENANCE HISTORY)
         */
        function renderHistoryTab(el) {
            const myVehicles = DB.get('vehicles').filter(v => v.userId === currentUser.id);
            const vehicleIds = myVehicles.map(v => v.id);
            const allHistory = DB.get('history').filter(h => vehicleIds.includes(h.vehicleId)).sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
            const history = allHistory.filter(h => {
                const vehicleMatches = historyFilters.vehicleId === 'all' || String(h.vehicleId) === String(historyFilters.vehicleId);
                const dateMatches = (!historyFilters.dateFrom || String(h.date || '') >= historyFilters.dateFrom) && (!historyFilters.dateTo || String(h.date || '') <= historyFilters.dateTo);
                return vehicleMatches && dateMatches;
            });

            el.innerHTML = `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                    <div>
                        <h2 class="text-xl sm:text-2xl font-extrabold text-slate-900 tracking-tight">Nhật ký bảo dưỡng (${history.length}${history.length !== allHistory.length ? ` / ${allHistory.length}` : ''} bản ghi)</h2>
                        <p class="text-slate-500 text-sm">Theo dõi các lần bảo dưỡng đã hoàn thành và chi phí thực tế</p>
                    </div>
                    <button type="button" onclick="openAddHistoryModal()" class="inline-flex items-center space-x-2 bg-violet-600 hover:bg-violet-700 text-white px-4 py-2.5 rounded-xl text-sm font-bold shadow-sm transition">
                        <i class="fa-solid fa-pen-to-square"></i>
                        <span>Ghi chép thủ công</span>
                    </button>
                </div>

                <div class="mb-4 grid grid-cols-1 gap-3 rounded-2xl border border-slate-200 bg-white p-4 sm:grid-cols-3">
                    <div><label for="history-filter-vehicle" class="mb-1 block text-xs font-bold uppercase tracking-wider text-slate-500">Phương tiện</label><select id="history-filter-vehicle" onchange="updateHistoryFilter('vehicleId', this.value)" class="w-full rounded-xl border px-3 py-2.5 text-sm"><option value="all">Tất cả phương tiện</option>${myVehicles.map(v => `<option data-pvmis-no-translate="true" value="${v.id}" ${String(historyFilters.vehicleId) === String(v.id) ? 'selected' : ''}>${escapeHTML(v.name)} (${escapeHTML(v.plate)})</option>`).join('')}</select></div>
                    <div><label for="history-filter-from" class="mb-1 block text-xs font-bold uppercase tracking-wider text-slate-500">Từ ngày</label><input id="history-filter-from" type="date" value="${escapeHTML(historyFilters.dateFrom)}" onchange="updateHistoryFilter('dateFrom', this.value)" class="w-full rounded-xl border px-3 py-2.5 text-sm"></div>
                    <div><label for="history-filter-to" class="mb-1 block text-xs font-bold uppercase tracking-wider text-slate-500">Đến ngày</label><input id="history-filter-to" type="date" value="${escapeHTML(historyFilters.dateTo)}" onchange="updateHistoryFilter('dateTo', this.value)" class="w-full rounded-xl border px-3 py-2.5 text-sm"></div>
                    ${historyFilters.dateFrom && historyFilters.dateTo && historyFilters.dateFrom > historyFilters.dateTo ? '<p class="sm:col-span-3 text-xs font-semibold text-rose-600">Khoảng ngày không hợp lệ: ngày bắt đầu sau ngày kết thúc.</p>' : ''}
                    ${historyFilters.vehicleId !== 'all' || historyFilters.dateFrom || historyFilters.dateTo ? '<button type="button" onclick="clearHistoryFilters()" class="justify-self-start text-xs font-bold text-violet-600 hover:text-violet-800">Xóa bộ lọc</button>' : ''}
                </div>

                <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase text-[11px] tracking-wider font-bold">
                                <tr>
                                    <th class="p-4">Ngày thực hiện</th>
                                    <th class="p-4">Phương tiện</th>
                                    <th class="p-4">Công việc / Hạng mục</th>
                                    <th class="p-4">Đơn vị sửa chữa</th>
                                    <th class="p-4">Ghi chú</th>
                                    <th class="p-4">ODO</th>
                                    <th class="p-4 text-right">Chi phí</th>
                                    <th class="p-4 text-right">Chi tiết</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                ${history.length === 0 ? `
                                    <tr>
                                        <td colspan="8" class="p-8 text-center text-slate-400 font-medium">${allHistory.length ? 'Không có bản ghi phù hợp với bộ lọc.' : 'Chưa có lịch sử bảo dưỡng nào được ghi nhận.'}</td>
                                    </tr>
                                ` : history.map(h => {
                                    const v = myVehicles.find(x => x.id === h.vehicleId);
                                    return `
                                        <tr class="hover:bg-slate-50/80 transition">
                                            <td class="p-4 font-semibold text-slate-700 whitespace-nowrap">
                                                <i class="fa-regular fa-clock mr-1 text-slate-400"></i> ${escapeHTML(h.date || '—')}
                                            </td>
                                            <td class="p-4">
                                                <div class="font-bold text-slate-900">${v ? preserveUserText(v.name) : 'Không xác định'}</div>
                                                <div class="text-xs text-slate-400">${v ? preserveUserText(v.plate) : ''}</div>
                                            </td>
                                            <td class="p-4 font-medium text-slate-800">${h.serviceName ? displayStoredText(h.serviceName) : (currentLanguage === 'en' ? 'Maintenance' : 'Bảo dưỡng')}</td>
                                            <td class="p-4 text-xs font-semibold text-slate-600">${h.provider ? displayStoredText(h.provider) : (currentLanguage === 'en' ? 'Garage' : 'Gara')}</td>
                                            <td class="p-4 text-xs text-slate-500 max-w-xs truncate">${h.notes ? displayStoredText(h.notes) : '-'}</td>
                                            <td class="p-4 text-xs text-slate-500 whitespace-nowrap">${h.odo !== undefined && h.odo !== null && h.odo !== '' ? `${Number(h.odo).toLocaleString(currentLocale())} km` : '—'}</td>
                                            <td class="p-4 text-right font-black text-rose-600 whitespace-nowrap">${formatVND(h.cost)}</td>
                                            <td class="p-4 text-right"><button type="button" onclick="viewHistoryDetails(${h.id})" aria-label="Xem chi tiết lịch sử" class="rounded-lg border border-slate-700 px-2.5 py-1.5 text-slate-300 hover:bg-white/5"><i class="fa-regular fa-eye"></i></button></td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function updateHistoryFilter(key, value) {
            if (!['vehicleId', 'dateFrom', 'dateTo'].includes(key)) return;
            historyFilters[key] = value;
            renderCurrentTabContent();
        }

        function clearHistoryFilters() {
            historyFilters = { vehicleId: 'all', dateFrom: '', dateTo: '' };
            renderCurrentTabContent();
        }

        function viewHistoryDetails(id) {
            if (!currentUser) return;
            const history = DB.get('history').find(item => item.id === id);
            const vehicle = history && DB.get('vehicles').find(item => item.id === history.vehicleId && item.userId === currentUser.id);
            if (!history || !vehicle) return;
            openModal(`
                <div class="p-5 sm:p-6">
                    <div class="flex items-center justify-between border-b border-slate-700 pb-4"><div><p class="text-xs font-bold uppercase tracking-wider text-violet-300">Lịch sử bảo dưỡng</p><h3 class="mt-1 text-lg font-black text-slate-100">${history.serviceName ? displayStoredText(history.serviceName) : (currentLanguage === 'en' ? 'Maintenance Record Details' : 'Chi tiết lần bảo dưỡng')}</h3></div><button type="button" onclick="closeModal()" aria-label="${currentLanguage === 'en' ? 'Close' : 'Đóng'}" class="text-slate-400 hover:text-slate-100"><i class="fa-solid fa-xmark"></i></button></div>
                    <dl class="mt-5 grid grid-cols-1 gap-3 sm:grid-cols-2">
                        <div class="rounded-xl bg-slate-800 p-3"><dt class="text-xs text-slate-400">Phương tiện</dt><dd class="mt-1 font-bold text-slate-100">${preserveUserText(vehicle.name)} · ${preserveUserText(vehicle.plate)}</dd></div>
                        <div class="rounded-xl bg-slate-800 p-3"><dt class="text-xs text-slate-400">Ngày thực hiện</dt><dd class="mt-1 font-bold text-slate-100">${escapeHTML(history.date || '—')}</dd></div>
                        <div class="rounded-xl bg-slate-800 p-3"><dt class="text-xs text-slate-400">Đơn vị sửa chữa</dt><dd class="mt-1 font-bold text-slate-100">${history.provider ? displayStoredText(history.provider) : (currentLanguage === 'en' ? 'Garage' : 'Gara')}</dd></div>
                        <div class="rounded-xl bg-slate-800 p-3"><dt class="text-xs text-slate-400">Chi phí</dt><dd class="mt-1 font-bold text-rose-300">${formatVND(history.cost)}</dd></div>
                        <div class="rounded-xl bg-slate-800 p-3 sm:col-span-2"><dt class="text-xs text-slate-400">ODO lúc bảo dưỡng</dt><dd class="mt-1 font-bold text-slate-100">${history.odo !== undefined && history.odo !== null && history.odo !== '' ? `${Number(history.odo).toLocaleString(currentLocale())} km` : 'Chưa được ghi nhận'}</dd></div>
                        <div class="rounded-xl bg-slate-800 p-3 sm:col-span-2"><dt class="text-xs text-slate-400">Ghi chú</dt><dd class="mt-1 whitespace-pre-wrap text-sm text-slate-200">${history.notes ? displayStoredText(history.notes) : (currentLanguage === 'en' ? 'No notes' : 'Không có ghi chú')}</dd></div>
                    </dl>
                    <div class="mt-5 flex justify-end"><button type="button" onclick="closeModal()" class="rounded-xl bg-violet-600 px-5 py-2 text-sm font-bold text-white hover:bg-violet-700">Đóng</button></div>
                </div>
            `);
        }

        function openAddHistoryModal() {
            const myVehicles = DB.get('vehicles').filter(v => v.userId === currentUser.id);
            if (myVehicles.length === 0) {
                showToast("Bạn cần thêm xe trước khi ghi chép!", "error");
                return;
            }

            openModal(`
                <div class="p-6">
                    <div class="flex justify-between items-center pb-4 border-b border-slate-100">
                        <h3 class="font-black text-lg text-slate-900">Ghi Nhật Ký Bảo Dưỡng Nhanh</h3>

        function handleCreateHistory(e) {
            e.preventDefault();
            if (!currentUser || currentUser.role !== 'owner') return;
            const vehicleId = parseInt(document.getElementById('hist-vehicle').value);
            const serviceName = document.getElementById('hist-service').value.trim();
            const date = document.getElementById('hist-date').value;
            const cost = parseInt(document.getElementById('hist-cost').value) || 0;
            const provider = document.getElementById('hist-provider').value.trim();
            const notes = document.getElementById('hist-note').value.trim();
            const odoInput = document.getElementById('hist-odo').value;
            const odo = odoInput === '' ? null : Number(odoInput);
            const ownedVehicle = DB.get('vehicles').some(v => v.id === vehicleId && v.userId === currentUser.id);
            if (!ownedVehicle || !serviceName || !/^\d{4}-\d{2}-\d{2}$/.test(date) || cost < 0) return showToast('Vui lòng kiểm tra phương tiện, nội dung, ngày và chi phí.', 'error');
            if (odo !== null && (!Number.isFinite(odo) || odo < 0)) return showToast('ODO phải là số không âm.', 'error');

            const history = DB.get('history');
            history.unshift({
                id: Date.now(),
                vehicleId,
                serviceName,
                date,
                cost,
                provider,
                notes,
                ...(odo !== null ? { odo } : {})
            });
            DB.set('history', history);
            closeModal();
            showToast("Đã thêm bản ghi lịch sử thành công!", "success");
            renderCurrentTabContent();
        }

        function exportCSVData() {
            const myVehicles = DB.get('vehicles').filter(v => v.userId === currentUser.id);
            const vehicleIds = myVehicles.map(v => v.id);
            const history = DB.get('history').filter(h => vehicleIds.includes(h.vehicleId));

            if (history.length === 0) {
                showToast("Không có dữ liệu lịch sử để xuất file!", "info");
                return;
            }

            const csvCell = value => {
                const text = String(value ?? '');
                const formulaSafe = /^[\s]*[=+\-@]/.test(text) ? `'${text}` : text;
                return `"${formulaSafe.replace(/"/g, '""')}"`;
            };
            let csvContent = "\uFEFF";
            csvContent += currentLanguage === 'en'
                ? "ID,Service Date,Vehicle,License Plate,Service,Cost (VND),Service Provider,Notes,Odometer (km)\n"
                : "Mã,Ngày thực hiện,Phương tiện,Biển kiểm soát,Hạng mục,Chi phí (VNĐ),Đơn vị thực hiện,Ghi chú,ODO (km)\n";

            history.forEach(h => {
                const v = myVehicles.find(x => x.id === h.vehicleId);
                const vehicleName = v ? v.name : '';
                const vehiclePlate = v ? v.plate : '';
                csvContent += [h.id, h.date, vehicleName, vehiclePlate, h.serviceName, h.cost, h.provider || '', h.notes || '', h.odo ?? ''].map(csvCell).join(',') + "\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            const safeUserName = String(currentUser.name || 'PVMIS').replace(/[^a-zA-Z0-9_-]+/g, '_').replace(/^_+|_+$/g, '') || 'PVMIS';
            link.setAttribute("download", `${currentLanguage === 'en' ? 'Maintenance_Report' : 'BaoCao_BaoDuong'}_${safeUserName}_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            showToast("Đã xuất file báo cáo CSV thành công!", "success");
        }
