<!DOCTYPE html>
<html lang="vi" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoCare Pro - Hệ Thống Quản Lý Bảo Dưỡng Phương Tiện</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Pro Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="h-full flex flex-col text-slate-800 antialiased">

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- ROOT CONTAINER -->
    <div id="app" class="flex-1 flex flex-col min-h-screen"></div>

    <!-- MODAL BACKDROP -->
    <div id="modal-container" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
        <div id="modal-content" class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden transform transition-all scale-95 opacity-0 duration-200"></div>
    </div>

    <script>
        // ==========================================
        // 1. DATA ENGINE (LOCAL STORAGE DB)
        // ==========================================
        const DB = {
            init() {
                if (!localStorage.getItem('ac_users')) {
                    localStorage.setItem('ac_users', JSON.stringify([
                        { id: 1, name: "Trần Minh Quân", email: "user@gmail.com", pass: "123456", role: "owner", avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" },
                        { id: 2, name: "Quản Trị Viên", email: "admin@gmail.com", pass: "123456", role: "admin", avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=150&q=80" }
                    ]));
                }
                if (!localStorage.getItem('ac_vehicles')) {
                    localStorage.setItem('ac_vehicles', JSON.stringify([
                        { 
                            id: 101, 
                            userId: 1, 
                            name: "Mazda CX-5 2.5 AWD", 
                            plate: "30H-888.66", 
                            odo: 32500, 
                            type: "Ô tô",
                            img: "https://images.unsplash.com/photo-1549399542-7e3f8b79c341?auto=format&fit=crop&w=600&q=80",
                            lastService: "15/01/2025"
                        },
                        { 
                            id: 102, 
                            userId: 1, 
                            name: "Honda SH 150i ABS", 
                            plate: "29-D2 999.99", 
                            odo: 14200, 
                            type: "Xe máy",
                            img: "https://images.unsplash.com/photo-1558981403-c5f9899a28bc?auto=format&fit=crop&w=600&q=80",
                            lastService: "02/02/2025"
                        }
                    ]));
                }
                if (!localStorage.getItem('ac_schedules')) {
                    localStorage.setItem('ac_schedules', JSON.stringify([
                        { id: 201, vehicleId: 101, service: "Bảo dưỡng định kỳ mốc 35.000 km & đảo lốp", date: "2025-04-12", cost: 2800000, status: "pending", priority: "Cao" },
                        { id: 202, vehicleId: 102, service: "Thay dầu máy Motul & Vệ sinh nồi xe", date: "2025-04-20", cost: 450000, status: "pending", priority: "Trung bình" }
                    ]));
                }
                if (!localStorage.getItem('ac_history')) {
                    localStorage.setItem('ac_history', JSON.stringify([
                        { id: 301, vehicleId: 101, service: "Thay 4 lốp Michelin Pilot Sport", date: "2025-01-15", cost: 11200000, note: "Bảo hành 2 năm tại Michelin Center" },
                        { id: 302, vehicleId: 102, service: "Thay má phanh đĩa trước & sau", date: "2025-02-02", cost: 680000, note: "Phụ tùng chính hãng Honda" }
                    ]));
                }
                if (!localStorage.getItem('ac_categories')) {
                    localStorage.setItem('ac_categories', JSON.stringify([
                        { id: 1, name: "Bảo dưỡng hệ thống Phanh / Lốp", baseCost: 500000 },
                        { id: 2, name: "Dầu động cơ, Lọc nhớt & Phụ gia", baseCost: 350000 },
                        { id: 3, name: "Bảo dưỡng cấp lớn toàn diện", baseCost: 3500000 }
                    ]));
                }
            },
            get: (key) => JSON.parse(localStorage.getItem('ac_' + key) || '[]'),
            set: (key, val) => localStorage.setItem('ac_' + key, JSON.stringify(val))
        };

        DB.init();

        // ==========================================
        // 2. STATE MANAGER
        // ==========================================
        let currentUser = JSON.parse(sessionStorage.getItem('ac_user')) || null;
        let currentTab = 'vehicles'; // 'vehicles' | 'schedules' | 'history' | 'reports' | 'admin'

        // ==========================================
        // 3. UI COMPONENTS & HELPERS
        // ==========================================
        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const icon = type === 'success' ? 'fa-circle-check text-emerald-500' : 'fa-circle-exclamation text-rose-500';
            toast.className = 'flex items-center space-x-3 bg-white px-4 py-3 rounded-xl shadow-xl border border-slate-100 text-sm font-semibold pointer-events-auto transform transition duration-300 translate-y-2 opacity-0';
            toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i> <span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function openModal(html) {
            const container = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            content.innerHTML = html;
            container.classList.remove('hidden');
            setTimeout(() => content.classList.remove('scale-95', 'opacity-0'), 10);
        }

        function closeModal() {
            const container = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => container.classList.add('hidden'), 200);
        }

        // ==========================================
        // 4. MAIN CONTROLLER
        // ==========================================
        function render() {
            const app = document.getElementById('app');

            // NẾU CHƯA ĐĂNG NHẬP -> RENDER LANDING PAGE SANG TRỌNG
            if (!currentUser) {
                app.innerHTML = `
                    <div class="relative min-h-screen bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 flex flex-col justify-between text-white overflow-hidden">
                        <!-- HEADER CHƯA ĐĂNG NHẬP -->
                        <header class="relative z-10 max-w-7xl mx-auto px-6 h-20 flex items-center justify-between w-full">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 rounded-xl bg-indigo-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                                    <i class="fa-solid fa-bolt text-xl text-white"></i>
                                </div>
                                <span class="text-xl font-bold tracking-tight">AutoCare <span class="text-indigo-400">Pro</span></span>
                            </div>
                            <div class="flex items-center space-x-3">
                                <button onclick="openLoginModal()" class="px-4 py-2 rounded-xl text-sm font-semibold text-slate-300 hover:text-white transition">Đăng nhập</button>
                                <button onclick="openRegisterModal()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-sm font-semibold shadow-lg shadow-indigo-600/30 transition">Đăng ký</button>
                            </div>
                        </header>

                        <!-- HERO SECTION -->
                        <div class="relative z-10 max-w-7xl mx-auto px-6 py-12 flex-1 flex flex-col lg:flex-row items-center justify-between gap-12">
                            <div class="max-w-xl text-center lg:text-left">
                                <div class="inline-flex items-center space-x-2 bg-indigo-500/10 border border-indigo-400/20 px-3 py-1.5 rounded-full text-indigo-300 text-xs font-semibold mb-6">
                                    <span class="w-2 h-2 rounded-full bg-indigo-400 animate-pulse"></span>
                                    <span>Hệ thống Quản lý Phương tiện Thông minh v2.0</span>
                                </div>
                                <h1 class="text-4xl sm:text-5xl lg:text-6xl font-extrabold tracking-tight leading-tight">
                                    Chăm sóc xế yêu <br><span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-sky-300">Chuẩn mực & Tiết kiệm</span>
                                </h1>
                                <p class="mt-5 text-slate-400 text-base sm:text-lg leading-relaxed">
                                    Theo dõi chi phí, tự động nhắc nhở lịch thay nhớt, bảo dưỡng định kỳ và trích xuất báo cáo chi phí minh bạch cho toàn bộ xe máy & ô tô của gia đình bạn.
                                </p>
                                
                                <!-- NÚT TRẢI NGHIỆM NHANH (DEMO ACCOUNTS) -->
                                <div class="mt-8 p-4 rounded-2xl bg-white/5 border border-white/10 backdrop-blur-md">
                                    <p class="text-xs uppercase tracking-wider text-slate-400 font-bold mb-3">Đăng nhập nhanh để trải nghiệm chức năng:</p>
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <button onclick="loginDirect('user@gmail.com')" class="flex items-center justify-center space-x-2 bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-3 rounded-xl font-semibold text-sm transition shadow-lg shadow-indigo-600/40">
                                            <i class="fa-solid fa-car"></i>
                                            <span>Demo: Chủ Xe (Owner)</span>
                                        </button>
                                        <button onclick="loginDirect('admin@gmail.com')" class="flex items-center justify-center space-x-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white px-4 py-3 rounded-xl font-semibold text-sm transition">
                                            <i class="fa-solid fa-shield-halved"></i>
                                            <span>Demo: Quản Trị (Admin)</span>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <!-- BANNER MINH HOẠ -->
                            <div class="w-full max-w-lg relative">
                                <div class="absolute -inset-1 bg-gradient-to-r from-indigo-500 to-sky-500 rounded-3xl blur-2xl opacity-30"></div>
                                <div class="relative bg-slate-800/90 border border-slate-700 rounded-3xl p-6 shadow-2xl overflow-hidden">
                                    <img src="https://images.unsplash.com/photo-1617788138017-80ad40651399?auto=format&fit=crop&w=800&q=80" class="w-full h-56 object-cover rounded-2xl mb-4" alt="Vehicle">
                                    <div class="flex justify-between items-center text-sm">
                                        <div>
                                            <p class="font-bold text-white text-base">Porsche Taycan 4S</p>
                                            <p class="text-xs text-slate-400">Đã đi: 18,200 km • Bảo dưỡng tiếp theo: 20/05</p>
                                        </div>
                                        <span class="px-3 py-1 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-full text-xs font-semibold">Tình trạng tốt</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- FOOTER -->
                        <footer class="relative z-10 max-w-7xl mx-auto px-6 py-6 border-t border-slate-800/60 w-full text-center text-xs text-slate-500">
                            Personal Vehicle Maintenance Information System &copy; 2025. Thiết kế chuyên nghiệp cho bài tập lớn.
                        </footer>
                    </div>
                `;
                return;
            }

            // GIAO DIỆN SAU KHI ĐĂNG NHẬP: CHUẨN DASHBOARD SAAS
            app.innerHTML = `
                <div class="flex h-screen overflow-hidden bg-slate-50">
                    <!-- SIDEBAR TRÁI -->
                    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between hidden md:flex border-r border-slate-800">
                        <div>
                            <!-- LOGO -->
                            <div class="h-20 flex items-center px-6 space-x-3 border-b border-slate-800">
                                <div class="w-9 h-9 rounded-xl bg-indigo-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                                    <i class="fa-solid fa-bolt text-lg text-white"></i>
                                </div>
                                <div>
                                    <h2 class="font-bold text-white text-base leading-tight">AutoCare <span class="text-indigo-400">Pro</span></h2>
                                    <p class="text-[10px] text-slate-400 tracking-wider uppercase">Maintenance OS</p>
                                </div>
                            </div>

                            <!-- MENU DÙNG THEO ROLE -->
                            <div class="p-4 space-y-1">
                                ${currentUser.role === 'owner' ? `
                                    <div class="px-3 py-2 text-[10px] font-bold text-slate-400 uppercase tracking-wider">Bảng điều khiển xe</div>
                                    <button onclick="navigate('vehicles')" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-sm font-semibold transition ${currentTab === 'vehicles' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'hover:bg-slate-800/60 text-slate-400 hover:text-white'}">
                                        <i class="fa-solid fa-gauge-high w-5"></i> <span>UC02 - Phương tiện</span>
                                    </button>
                                    <button onclick="navigate('schedules')" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-sm font-semibold transition ${currentTab === 'schedules' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'hover:bg-slate-800/60 text-slate-400 hover:text-white'}">
                                        <i class="fa-solid fa-calendar-check w-5"></i> <span>UC04 - Lịch bảo dưỡng</span>
                                    </button>
                                    <button onclick="navigate('history')" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-sm font-semibold transition ${currentTab === 'history' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'hover:bg-slate-800/60 text-slate-400 hover:text-white'}">
                                        <i class="fa-solid fa-clock-rotate-left w-5"></i> <span>UC03 - Lịch sử sửa chữa</span>
                                    </button>
                                    <button onclick="navigate('reports')" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-sm font-semibold transition ${currentTab === 'reports' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'hover:bg-slate-800/60 text-slate-400 hover:text-white'}">
                                        <i class="fa-solid fa-chart-pie w-5"></i> <span>UC05 - Báo cáo & Xuất CSV</span>
                                    </button>
                                ` : `
                                    <div class="px-3 py-2 text-[10px] font-bold text-slate-400 uppercase tracking-wider">Quản trị hệ thống</div>
                                    <button onclick="navigate('admin')" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-sm font-semibold bg-indigo-600 text-white shadow-lg shadow-indigo-600/30">
                                        <i class="fa-solid fa-sliders w-5"></i> <span>Quản trị viên (Admin)</span>
                                    </button>
                                `}
                            </div>
                        </div>

                        <!-- PROFILE FOOTER -->
                        <div class="p-4 border-t border-slate-800">
                            <div class="flex items-center justify-between bg-slate-800/60 p-3 rounded-xl border border-slate-800">
                                <div class="flex items-center space-x-3 overflow-hidden">
                                    <img src="${currentUser.avatar}" class="w-9 h-9 rounded-full object-cover ring-2 ring-indigo-500/50" alt="avatar">
                                    <div class="truncate">
                                        <div class="font-bold text-xs text-white truncate">${currentUser.name}</div>
                                        <div class="text-[10px] text-slate-400 capitalize">${currentUser.role === 'admin' ? 'Quản trị viên' : 'Chủ xe'}</div>
                                    </div>
                                </div>
                                <button onclick="logout()" class="text-slate-400 hover:text-rose-400 transition" title="Đăng xuất">
                                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                                </button>
                            </div>
                        </div>
                    </aside>

                    <!-- CONTENT CHÍNH BÊN PHẢI -->
                    <div class="flex-1 flex flex-col overflow-y-auto custom-scrollbar">
                        <!-- TOPBAR MOBILE / DESKTOP -->
                        <header class="h-20 bg-white border-b border-slate-200 px-6 flex items-center justify-between sticky top-0 z-30">
                            <div class="flex items-center space-x-3 md:hidden">
                                <div class="w-8 h-8 rounded-lg bg-indigo-500 flex items-center justify-center text-white font-bold">A</div>
                                <span class="font-bold text-slate-800">AutoCare</span>
                            </div>
                            <div class="hidden md:block">
                                <h2 class="text-lg font-bold text-slate-800 capitalize">${getTitleByTab()}</h2>
                                <p class="text-xs text-slate-400">Personal Vehicle Maintenance Information System</p>
                            </div>
                            <div class="flex items-center space-x-3">
                                <button onclick="logout()" class="md:hidden text-rose-500 font-semibold text-xs border border-rose-200 px-3 py-1.5 rounded-lg">Thoát</button>
                                <div class="hidden sm:flex items-center space-x-2 text-xs bg-slate-100 border border-slate-200 px-3 py-1.5 rounded-full text-slate-600">
                                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                                    <span>Hệ thống trực tuyến</span>
                                </div>
                            </div>
                        </header>

                        <!-- KHU VỰC NỘI DUNG TỪNG TAB -->
                        <main class="p-6 md:p-8 max-w-7xl w-full mx-auto" id="viewport"></main>
                    </div>
                </div>
            `;

            renderViewport();
        }

        function getTitleByTab() {
            switch(currentTab) {
                case 'vehicles': return 'Quản lý phương tiện cá nhân (UC02)';
                case 'schedules': return 'Lịch trình bảo dưỡng định kỳ (UC04)';
                case 'history': return 'Lịch sử nhật ký sửa chữa (UC03)';
                case 'reports': return 'Báo cáo chi phí & Xuất tệp tin (UC05)';
                case 'admin': return 'Bảng điều khiển Quản trị viên (Admin)';
                default: return 'Bảng điều khiển';
            }
        }

        function navigate(tab) {
            currentTab = tab;
            render();
        }

        function renderViewport() {
            const vp = document.getElementById('viewport');
            if (!vp) return;

            if (currentTab === 'vehicles') renderVehicles(vp);
            if (currentTab === 'schedules') renderSchedules(vp);
            if (currentTab === 'history') renderHistory(vp);
            if (currentTab === 'reports') renderReports(vp);
            if (currentTab === 'admin') renderAdmin(vp);
        }

        // ==========================================
        // USE CASE 02: QUẢN LÝ PHƯƠNG TIỆN
        // ==========================================
        function renderVehicles(container) {
            const list = DB.get('vehicles').filter(v => v.userId === currentUser.id);

            container.innerHTML = `
                <!-- TOP BANNER -->
                <div class="relative rounded-3xl bg-gradient-to-r from-indigo-900 to-indigo-700 text-white p-6 sm:p-8 mb-8 overflow-hidden shadow-xl shadow-indigo-950/10">
                    <div class="relative z-10 max-w-xl">
                        <span class="px-3 py-1 rounded-full bg-indigo-500/30 text-indigo-200 text-xs font-semibold mb-3 inline-block">Garage cá nhân</span>
                        <h2 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Xin chào, ${currentUser.name}!</h2>
                        <p class="text-indigo-200 text-sm mt-2">Hiện bạn đang quản lý <b class="text-white">${list.length} phương tiện</b> đang hoạt động ổn định.</p>
                    </div>
                    <i class="fa-solid fa-car-side absolute right-4 -bottom-4 text-8xl text-white/10 hidden sm:block"></i>
                </div>

                <!-- ACTION HEADER -->
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                    <div>
                        <h3 class="font-bold text-xl text-slate-800">Danh sách xe của bạn</h3>
                        <p class="text-xs text-slate-400">Xem thông tin chi tiết hoặc bổ sung phương tiện mới</p>
                    </div>
                    <button onclick="openAddVehicleModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2.5 rounded-xl font-semibold text-sm shadow-lg shadow-indigo-600/30 flex items-center space-x-2 transition">
                        <i class="fa-solid fa-plus"></i> <span>Thêm xe mới</span>
                    </button>
                </div>

                <!-- VEHICLE CARDS GRID -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    ${list.map(v => `
                        <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden hover:shadow-md transition group">
                            <div class="relative h-44 overflow-hidden bg-slate-100">
                                <img src="${v.img}" alt="${v.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                                <div class="absolute top-3 right-3 bg-slate-900/80 backdrop-blur-md text-white text-[11px] font-bold px-2.5 py-1 rounded-lg">
                                    ${v.type}
                                </div>
                            </div>
                            <div class="p-5">
                                <h4 class="font-bold text-lg text-slate-800">${v.name}</h4>
                                <div class="mt-4 space-y-2 text-xs">
                                    <div class="flex justify-between py-1 border-b border-slate-100">
                                        <span class="text-slate-400"><i class="fa-solid fa-id-card w-4"></i> Biển kiểm soát</span>
                                        <span class="font-bold text-slate-700 bg-slate-100 px-2 py-0.5 rounded">${v.plate}</span>
                                    </div>
                                    <div class="flex justify-between py-1 border-b border-slate-100">
                                        <span class="text-slate-400"><i class="fa-solid fa-gauge-high w-4"></i> Đồng hồ ODO</span>
                                        <span class="font-bold text-slate-700">${v.odo.toLocaleString()} km</span>
                                    </div>
                                    <div class="flex justify-between py-1">
                                        <span class="text-slate-400"><i class="fa-solid fa-calendar w-4"></i> Lần làm gần nhất</span>
                                        <span class="font-semibold text-slate-600">${v.lastService || 'Chưa cập nhật'}</span>
                                    </div>
                                </div>
                                <div class="mt-5 pt-3 border-t border-slate-100 flex justify-between items-center">

        function exportCSV() {
            const myVehicles = DB.get('vehicles').filter(v => v.userId === currentUser.id);
            const vIds = myVehicles.map(v => v.id);
            const history = DB.get('history').filter(h => vIds.includes(h.vehicleId));

            if (history.length === 0) {
                showToast("Chưa có lịch sử để xuất báo cáo!", "error");
                return;
            }

            let csv = "\uFEFFMã GD,Ngày thực hiện,Phương tiện,Hạng mục,Chi phí (VND),Ghi chú\n";
            history.forEach(h => {
                const v = myVehicles.find(x => x.id === h.vehicleId);
                csv += `${h.id},${h.date},"${v ? v.name : ''}","${h.service}",${h.cost},"${h.note || ''}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Bao_Cao_Bao_Duong_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
            showToast("Đã trích xuất tệp CSV thành công!");
        }

                    <div class="space-y-3 text-sm">
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                            <span class="text-xs text-slate-400">Hạng mục đã làm:</span>
                            <div class="font-bold text-slate-800">${item.service}</div>
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Chi phí thanh toán thực tế (VNĐ)</label>
                            <input id="c-cost" type="number" value="${item.cost}" class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 focus:outline-emerald-500 font-bold text-rose-600">
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Ghi chú phụ tùng / Gara</label>
                            <input id="c-note" type="text" placeholder="Đã thay xong, bảo hành 6 tháng..." class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 focus:outline-emerald-500">
                        </div>
                    </div>
                    <div class="mt-6 flex justify-end space-x-3">
                        <button onclick="closeModal()" class="px-4 py-2.5 rounded-xl border border-slate-200 text-sm font-semibold hover:bg-slate-50">Đóng</button>
                        <button onclick="submitCompleteSchedule(${scheduleId})" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-sm font-semibold shadow-lg shadow-emerald-600/30">Lưu vào lịch sử</button>
                    </div>
                </div>
            `);
        }

        function submitCompleteSchedule(id) {
            let schedules = DB.get('schedules');
            const item = schedules.find(s => s.id === id);
            if (!item) return;

            const cost = parseInt(document.getElementById('c-cost').value) || item.cost;
            const note = document.getElementById('c-note').value;

            // 1. Đánh dấu xong lịch
            item.status = "completed";
            DB.set('schedules', schedules);

            // 2. Thêm vào lịch sử (History)
            let history = DB.get('history');
            history.push({
                id: Date.now(),
                vehicleId: item.vehicleId,
                service: item.service,
                date: new Date().toISOString().split('T')[0],
                cost: cost,
                note: note
            });
            DB.set('history', history);

            closeModal();
            showToast("Bảo dưỡng hoàn tất! Đã cập nhật vào báo cáo.");
            renderViewport();
        }

        function openAddCatModal() {
            const name = prompt("Nhập tên dịch vụ bảo dưỡng chuẩn:");
            if (name) {
                const cats = DB.get('categories');
                cats.push({ id: Date.now(), name, baseCost: 200000 });
                DB.set('categories', cats);
                showToast("Đã bổ sung danh mục dịch vụ!");
                renderViewport();
            }
        }

        // ==========================================
        // AUTH ACTIONS (LOGIN / REGISTER)
        // ==========================================
        function loginDirect(email) {
            const user = DB.get('users').find(u => u.email === email);
            if (user) {
                currentUser = user;
                sessionStorage.setItem('ac_user', JSON.stringify(currentUser));
                currentTab = user.role === 'admin' ? 'admin' : 'vehicles';
                render();
                showToast(`Chào mừng ${user.name} đã đăng nhập!`);
            }
        }

        function logout() {
            sessionStorage.removeItem('ac_user');
            currentUser = null;
            render();
            showToast("Đã đăng xuất an toàn");
        }

        function openLoginModal() {
            openModal(`
                <div class="p-6">
                    <h3 class="font-bold text-xl text-slate-800 text-center mb-1">Đăng nhập tài khoản</h3>
                    <p class="text-xs text-slate-400 text-center mb-5">Hệ thống Quản lý Phương tiện AutoCare Pro</p>
                    <div class="space-y-3 text-sm">
                        <input id="log-email" type="email" placeholder="Email (user@gmail.com)" class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 focus:outline-indigo-500">
                        <input id="log-pass" type="password" placeholder="Mật khẩu (123456)" class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 focus:outline-indigo-500">
                    </div>
                    <button onclick="submitLogin()" class="w-full mt-5 py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-semibold shadow-lg shadow-indigo-600/30 transition">Đăng nhập</button>
                </div>
            `);
        }

        function submitLogin() {
            const email = document.getElementById('log-email').value.trim();
            const pass = document.getElementById('log-pass').value.trim();
            const user = DB.get('users').find(u => u.email === email && u.pass === pass);
            if (user) {
                currentUser = user;
                sessionStorage.setItem('ac_user', JSON.stringify(currentUser));
                closeModal();
                currentTab = user.role === 'admin' ? 'admin' : 'vehicles';
                render();
                showToast(`Đăng nhập thành công!`);
            } else {
                showToast("Email hoặc mật khẩu không đúng!", "error");
            }
        }

        function openRegisterModal() {
            openModal(`
                <div class="p-6">
                    <h3 class="font-bold text-xl text-slate-800 text-center mb-1">Đăng ký tài khoản</h3>
                    <p class="text-xs text-slate-400 text-center mb-5">Tạo tài khoản quản lý xe gia đình miễn phí</p>
                    <div class="space-y-3 text-sm">
                        <input id="reg-name" type="text" placeholder="Họ và tên của bạn" class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 focus:outline-indigo-500">
                        <input id="reg-email" type="email" placeholder="Địa chỉ Email" class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 focus:outline-indigo-500">
                        <input id="reg-pass" type="password" placeholder="Mật khẩu" class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 focus:outline-indigo-500">
                    </div>
                    <button onclick="submitRegister()" class="w-full mt-5 py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-semibold shadow-lg shadow-indigo-600/30 transition">Đăng ký ngay</button>
                </div>
            `);
        }

        function submitRegister() {
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const pass = document.getElementById('reg-pass').value.trim();

            if (!name || !email || !pass) return showToast("Vui lòng điền đủ các trường!", "error");

            const users = DB.get('users');
            if (users.find(u => u.email === email)) return showToast("Email này đã được sử dụng!", "error");

            const newUser = {
                id: Date.now(),
                name,
                email,
                pass,
                role: 'owner',
                avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80"
            };

            users.push(newUser);
            DB.set('users', users);

            currentUser = newUser;
            sessionStorage.setItem('ac_user', JSON.stringify(currentUser));
            closeModal();
            render();
            showToast("Đăng ký tài khoản thành công!");
        }

        // KHỞI ĐỘNG HỆ THỐNG
        render();
    </script>
</body>
</html>
