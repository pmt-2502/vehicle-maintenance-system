<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Bảo dưỡng Phương tiện Cá nhân</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <!-- NAVIGATION BAR -->
    <nav class="bg-blue-600 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center h-16">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-motorcycle text-2xl"></i>
                <span class="font-bold text-lg md:text-xl">Vehicle Care System</span>
            </div>
            <div id="nav-actions" class="flex items-center space-x-4">
                <!-- Sẽ render động qua Javascript -->
            </div>
        </div>
    </nav>

    <!-- MAIN CONTAINER -->
    <main class="max-w-7xl mx-auto px-4 py-6" id="app">
        <!-- Nội dung sẽ tự render dựa theo trạng thái đăng nhập -->
    </main>

    <!-- JAVASCRIPT: BACKEND MOCK & FRONTEND CONTROLLER -->
    <script>
        // ==========================================
        // 1. BACKEND & DATABASE LAYER (MÔ PHỎNG DATABASE TRÊN LOCALSTORAGE)
        // ==========================================
        const DB = {
            init() {
                if (!localStorage.getItem('vms_users')) {
                    const defaultUsers = [
                        { id: 1, name: "Nguyễn Văn A", email: "user@gmail.com", pass: "123456", role: "owner" },
                        { id: 2, name: "Quản trị viên", email: "admin@gmail.com", pass: "123456", role: "admin" }
                    ];
                    localStorage.setItem('vms_users', JSON.stringify(defaultUsers));
                }
                if (!localStorage.getItem('vms_vehicles')) {
                    const defaultVehicles = [
                        { id: 101, userId: 1, name: "Honda SH 150i", plate: "29A1-123.45", odo: 12500, type: "Xe tay ga" },
                        { id: 102, userId: 1, name: "Mazda 3", plate: "30H-999.88", odo: 45000, type: "Ô tô" }
                    ];
                    localStorage.setItem('vms_vehicles', JSON.stringify(defaultVehicles));
                }
                if (!localStorage.getItem('vms_schedules')) {
                    const defaultSchedules = [
                        { id: 201, vehicleId: 101, serviceName: "Thay dầu nhớt động cơ", date: "2025-04-10", cost: 250000, status: "pending" },
                        { id: 202, vehicleId: 102, serviceName: "Bảo dưỡng mốc 50,000 km", date: "2025-05-15", cost: 3500000, status: "pending" }
                    ];
                    localStorage.setItem('vms_schedules', JSON.stringify(defaultSchedules));
                }
                if (!localStorage.getItem('vms_history')) {
                    const defaultHistory = [
                        { id: 301, vehicleId: 101, serviceName: "Thay săm lốp sau", date: "2025-01-15", cost: 450000, notes: "Thay lốp Michelin" },
                        { id: 302, vehicleId: 102, serviceName: "Vệ sinh kim phun & bugi", date: "2025-02-01", cost: 1200000, notes: "Làm tại hãng" }
                    ];
                    localStorage.setItem('vms_history', JSON.stringify(defaultHistory));
                }
                if (!localStorage.getItem('vms_services')) {
                    const defaultServices = [
                        { id: 1, name: "Thay nhớt máy", basePrice: 200000 },
                        { id: 2, name: "Kiểm tra hệ thống phanh", basePrice: 150000 },
                        { id: 3, name: "Thay bugi", basePrice: 120000 }
                    ];
                    localStorage.setItem('vms_services', JSON.stringify(defaultServices));
                }
            },
            get(key) { return JSON.parse(localStorage.getItem('vms_' + key) || '[]'); },
            set(key, data) { localStorage.setItem('vms_' + key, JSON.stringify(data)); }
        };

        // ==========================================
        // 2. STATE MANAGEMENT & API CALLS
        // ==========================================
        let currentUser = JSON.parse(sessionStorage.getItem('vms_currentUser')) || null;
        let currentTab = 'vehicles'; // 'vehicles' | 'schedules' | 'history' | 'reports' | 'admin'

        DB.init();

        // ==========================================
        // 3. RENDER CONTROLLER (FRONTEND UI)
        // ==========================================
        function renderNavbar() {
            const nav = document.getElementById('nav-actions');
            if (currentUser) {
                nav.innerHTML = `
                    <span class="text-sm">Xin chào, <b>${currentUser.name}</b> (${currentUser.role === 'admin' ? 'Admin' : 'Chủ xe'})</span>
                    <button onclick="handleLogout()" class="bg-red-500 hover:bg-red-600 px-3 py-1.5 rounded-lg text-sm transition">
                        <i class="fa-solid fa-arrow-right-from-bracket mr-1"></i> Đăng xuất
                    </button>
                `;
            } else {
                nav.innerHTML = `
                    <button onclick="renderLoginModal(true)" class="hover:underline">Đăng nhập</button>
                    <button onclick="renderLoginModal(false)" class="bg-white text-blue-600 px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-gray-100 transition">Đăng ký</button>
                `;
            }
        }

        function renderApp() {
            renderNavbar();
            const app = document.getElementById('app');

            if (!currentUser) {
                app.innerHTML = `
                    <div class="max-w-md mx-auto mt-12 bg-white p-8 rounded-xl shadow-md text-center">
                        <i class="fa-solid fa-car-tunnel text-blue-600 text-5xl mb-4"></i>
                        <h2 class="text-2xl font-bold mb-2">Hệ Thống Quản Lý Bảo Dưỡng</h2>
                        <p class="text-gray-600 mb-6 text-sm">Ghi chép chi phí, nhắc lịch bảo dưỡng xe máy & ô tô dễ dàng.</p>
                        <div class="space-y-3">
                            <button onclick="fillAndLogin('user@gmail.com', '123456')" class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700">Đăng nhập Demo: Chủ xe</button>
                            <button onclick="fillAndLogin('admin@gmail.com', '123456')" class="w-full bg-gray-800 text-white py-2 rounded-lg font-medium hover:bg-black">Đăng nhập Demo: Admin</button>
                        </div>
                    </div>
                `;
                return;
            }

            // USER DASHBOARD
            app.innerHTML = `
                <!-- TABS -->
                <div class="flex border-b border-gray-300 mb-6 space-x-2">
                    ${currentUser.role === 'owner' ? `
                        <button onclick="switchTab('vehicles')" class="px-4 py-2 border-b-2 font-medium ${currentTab === 'vehicles' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500'}">
                            <i class="fa-solid fa-motorcycle mr-1"></i> UC02 - Phương tiện
                        </button>
                        <button onclick="switchTab('schedules')" class="px-4 py-2 border-b-2 font-medium ${currentTab === 'schedules' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500'}">
                            <i class="fa-solid fa-calendar-check mr-1"></i> UC04 - Lịch bảo dưỡng
                        </button>
                        <button onclick="switchTab('history')" class="px-4 py-2 border-b-2 font-medium ${currentTab === 'history' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500'}">
                            <i class="fa-solid fa-clock-rotate-left mr-1"></i> UC03 - Lịch sử
                        </button>
                        <button onclick="switchTab('reports')" class="px-4 py-2 border-b-2 font-medium ${currentTab === 'reports' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500'}">
                            <i class="fa-solid fa-chart-pie mr-1"></i> UC05 - Báo cáo & Xuất CSV
                        </button>
                    ` : `
                        <button onclick="switchTab('admin')" class="px-4 py-2 border-b-2 font-medium border-blue-600 text-blue-600">
                            <i class="fa-solid fa-users-gear mr-1"></i> Quản trị hệ thống (Admin)
                        </button>
                    `}
                </div>

                <!-- TAB CONTENT -->
                <div id="tab-content"></div>
            `;

            renderCurrentTabContent();
        }

        function switchTab(tab) {
            currentTab = tab;
            renderApp();
        }

        function renderCurrentTabContent() {
            const container = document.getElementById('tab-content');
            if (!container) return;

            if (currentTab === 'vehicles') renderVehiclesTab(container);
            else if (currentTab === 'schedules') renderSchedulesTab(container);
            else if (currentTab === 'history') renderHistoryTab(container);
            else if (currentTab === 'reports') renderReportsTab(container);
            else if (currentTab === 'admin') renderAdminTab(container);
        }

        // ==========================================
        // 4. USE CASE IMPLEMENTATIONS
        // ==========================================

        // UC02 - QUẢN LÝ PHƯƠNG TIỆN
        function renderVehiclesTab(el) {
            const list = DB.get('vehicles').filter(v => v.userId === currentUser.id);
            el.innerHTML = `
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold">Danh sách phương tiện của bạn</h2>
                    <button onclick="addNewVehicle()" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-green-700">
                        <i class="fa-solid fa-plus mr-1"></i> Thêm xe mới
                    </button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    ${list.map(v => `
                        <div class="bg-white p-5 rounded-lg shadow border border-gray-100 flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-start">
                                    <h3 class="font-bold text-lg text-blue-700">${v.name}</h3>
                                    <span class="text-xs bg-blue-100 text-blue-700 font-semibold px-2 py-0.5 rounded">${v.type}</span>
                                </div>
                                <p class="text-gray-600 text-sm mt-2"><i class="fa-solid fa-id-card mr-2"></i>Biển số: <b>${v.plate}</b></p>
                                <p class="text-gray-600 text-sm"><i class="fa-solid fa-gauge-high mr-2"></i>Odo: <b>${v.odo.toLocaleString()} km</b></p>
                            </div>
                            <div class="mt-4 pt-3 border-t flex justify-end space-x-2">
                                <button onclick="deleteVehicle(${v.id})" class="text-red-500 hover:text-red-700 text-sm"><i class="fa-solid fa-trash mr-1"></i>Xoá</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function addNewVehicle() {
            const name = prompt("Tên phương tiện (vd: Vision 2022):");
            if (!name) return;
            const plate = prompt("Biển số xe (vd: 59-X1 123.45):");
            const odo = parseInt(prompt("Số km đã đi:", "10000")) || 0;
            const type = prompt("Loại xe (Xe máy / Ô tô):", "Xe máy");

            const list = DB.get('vehicles');
            list.push({ id: Date.now(), userId: currentUser.id, name, plate, odo, type });
            DB.set('vehicles', list);
            renderCurrentTabContent();
        }

        function deleteVehicle(id) {
            if (confirm("Bạn có chắc muốn xoá phương tiện này?")) {
                let list = DB.get('vehicles').filter(v => v.id !== id);
                DB.set('vehicles', list);
                renderCurrentTabContent();
            }
        }

        // UC04 - QUẢN LÝ LỊCH BẢO DƯỠNG (KÈM EXTEND HOÀN TẤT)
        function renderSchedulesTab(el) {
            const myVehicles = DB.get('vehicles').filter(v => v.userId === currentUser.id);
            const vehicleIds = myVehicles.map(v => v.id);
            const list = DB.get('schedules').filter(s => vehicleIds.includes(s.vehicleId) && s.status === 'pending');

            el.innerHTML = `
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold">Lịch bảo dưỡng định kỳ sắp tới</h2>
                    <button onclick="addNewSchedule()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-700">
                        <i class="fa-solid fa-calendar-plus mr-1"></i> Tạo lịch bảo dưỡng
                    </button>
                </div>
                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead class="bg-gray-50 border-b">
                            <tr>
                                <th class="p-3">Xe</th>
                                <th class="p-3">Hạng mục bảo dưỡng</th>
                                <th class="p-3">Ngày dự kiến</th>
                                <th class="p-3">Chi phí dự kiến</th>
                                <th class="p-3 text-right">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${list.length === 0 ? `<tr><td colspan="5" class="p-4 text-center text-gray-500">Không có lịch bảo dưỡng nào sắp tới.</td></tr>` : ''}
                            ${list.map(s => {
                                const v = myVehicles.find(item => item.id === s.vehicleId);
                                return `
                                    <tr class="border-b hover:bg-gray-50">
                                        <td class="p-3 font-semibold">${v ? v.name : 'Unknown'} (${v ? v.plate : ''})</td>
                                        <td class="p-3">${s.serviceName}</td>
                                        <td class="p-3 text-orange-600 font-medium">${s.date}</td>
                                        <td class="p-3 font-medium">${s.cost.toLocaleString()} VNĐ</td>
                                        <td class="p-3 text-right">
                                            <button onclick="completeSchedule(${s.id})" class="bg-green-600 text-white px-3 py-1 rounded text-xs hover:bg-green-700">
                                                <i class="fa-solid fa-check mr-1"></i> Hoàn tất bảo dưỡng
                                            </button>
                                        </td>
                                    </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function addNewSchedule() {
            const myVehicles = DB.get('vehicles').filter(v => v.userId === currentUser.id);
            if (myVehicles.length === 0) {
                alert("Bạn cần thêm phương tiện trước!");
                return;
            }
            const vehicleId = parseInt(prompt("Chọn xe bằng ID:\n" + myVehicles.map(v => `${v.id}: ${v.name} (${v.plate})`).join("\n")));
            const serviceName = prompt("Hạng mục cần làm:", "Thay lốp");
            const date = prompt("Ngày bảo dưỡng (YYYY-MM-DD):", "2025-04-20");
            const cost = parseInt(prompt("Chi phí ước lượng (VNĐ):", "300000")) || 0;

            const list = DB.get('schedules');
            list.push({ id: Date.now(), vehicleId, serviceName, date, cost, status: "pending" });
            DB.set('schedules', list);
            renderCurrentTabContent();
        }

        // <<Extend>> HOÀN TẤT MỘT LỊCH BẢO DƯỠNG -> GHI NHẬN LỊCH SỬ (INCLUDE)
        function completeSchedule(id) {
            let schedules = DB.get('schedules');
            const item = schedules.find(s => s.id === id);
            if (!item) return;

            const actualCost = parseInt(prompt("Xác nhận chi phí thực tế đã thanh toán (VNĐ):", item.cost)) || item.cost;
            const note = prompt("Ghi chú phụ tùng / cửa hàng:", "Đã thực hiện xong");

            // 1. Cập nhật trạng thái lịch
            item.status = "completed";
            DB.set('schedules', schedules);

            // 2. Ghi nhận vào Lịch sử (UC03)
            let history = DB.get('history');
            history.push({
                id: Date.now(),
                vehicleId: item.vehicleId,
                serviceName: item.serviceName,
                date: new Date().toISOString().split('T')[0],
                cost: actualCost,
                notes: note
            });
            DB.set('history', history);

            alert("Đã lưu vào lịch sử bảo dưỡng thành công!");
            renderCurrentTabContent();
        }

        // UC03 - LỊCH SỬ BẢO DƯỠNG
        function renderHistoryTab(el) {
            const myVehicles = DB.get('vehicles').filter(v => v.userId === currentUser.id);
            const vehicleIds = myVehicles.map(v => v.id);
            const list = DB.get('history').filter(h => vehicleIds.includes(h.vehicleId));

            el.innerHTML = `
                <h2 class="text-xl font-bold mb-4">Lịch sử bảo dưỡng phương tiện</h2>
                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead class="bg-gray-50 border-b">
                            <tr>
                                <th class="p-3">Ngày làm</th>
                                <th class="p-3">Xe</th>
                                <th class="p-3">Nội dung thực hiện</th>
                                <th class="p-3">Chi phí</th>
                                <th class="p-3">Ghi chú</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${list.map(h => {
                                const v = myVehicles.find(x => x.id === h.vehicleId);
                                return `
                                    <tr class="border-b">
                                        <td class="p-3 font-semibold">${h.date}</td>
                                        <td class="p-3">${v ? v.name : 'Unknown'}</td>
                                        <td class="p-3">${h.serviceName}</td>
                                        <td class="p-3 font-bold text-red-600">${h.cost.toLocaleString()} VNĐ</td>
                                        <td class="p-3 text-gray-500">${h.notes || '-'}</td>
                                    </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // UC05 - XEM BÁO CÁO CHI PHÍ & XUẤT FILE CSV
        function renderReportsTab(el) {
            const myVehicles = DB.get('vehicles').filter(v => v.userId === currentUser.id);
            const vehicleIds = myVehicles.map(v => v.id);
            const history = DB.get('history').filter(h => vehicleIds.includes(h.vehicleId));

            const total = history.reduce((sum, item) => sum + item.cost, 0);

            el.innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h2 class="text-xl font-bold">Báo cáo & Thống kê chi phí</h2>
                        <p class="text-gray-500 text-sm">Tổng chi phí bạn đã chi trả cho bảo dưỡng xe</p>
                    </div>
                    <button onclick="exportCSV()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-emerald-700">
                        <i class="fa-solid fa-file-csv mr-1"></i> <<Extend>> Xuất báo cáo CSV
                    </button>
                </div>

                <!-- STATS CARD -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                    <div class="bg-white p-5 rounded-lg shadow border-l-4 border-blue-600">
                        <p class="text-gray-500 text-xs uppercase font-bold">Tổng chi phí bảo dưỡng</p>
                        <h3 class="text-2xl font-black text-gray-800 mt-1">${total.toLocaleString()} VNĐ</h3>
                    </div>
                    <div class="bg-white p-5 rounded-lg shadow border-l-4 border-emerald-600">
                        <p class="text-gray-500 text-xs uppercase font-bold">Số lượng xe</p>
                        <h3 class="text-2xl font-black text-gray-800 mt-1">${myVehicles.length} phương tiện</h3>
                    </div>
                    <div class="bg-white p-5 rounded-lg shadow border-l-4 border-purple-600">
                        <p class="text-gray-500 text-xs uppercase font-bold">Tổng số lần sửa chữa</p>
                        <h3 class="text-2xl font-black text-gray-800 mt-1">${history.length} lần</h3>
                    </div>
                </div>

                <!-- CHI TIẾT THEO TỪNG XE -->
                <h3 class="font-bold text-lg mb-3">Chi tiết chi phí theo từng phương tiện</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    ${myVehicles.map(v => {
                        const vehicleHistory = history.filter(h => h.vehicleId === v.id);
                        const subTotal = vehicleHistory.reduce((s, i) => s + i.cost, 0);
                        return `
                            <div class="bg-white p-4 rounded-lg shadow">
                                <div class="flex justify-between items-center border-b pb-2 mb-2">
                                    <h4 class="font-bold text-blue-600">${v.name} (${v.plate})</h4>
                                    <span class="font-bold text-red-600">${subTotal.toLocaleString()} VNĐ</span>
                                </div>
                                <ul class="text-sm space-y-1 text-gray-600">
                                    ${vehicleHistory.map(h => `<li>• ${h.date}: ${h.serviceName} - ${h.cost.toLocaleString()}đ</li>`).join('')}
                                    ${vehicleHistory.length === 0 ? `<li class="italic text-gray-400">Chưa có phát sinh chi phí</li>` : ''}
                                </ul>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        // XUẤT CSV (EXTEND UC05)
        function exportCSV() {
            const myVehicles = DB.get('vehicles').filter(v => v.userId === currentUser.id);
            const vehicleIds = myVehicles.map(v => v.id);
            const history = DB.get('history').filter(h => vehicleIds.includes(h.vehicleId));

            let csvContent = "data:text/csv;charset=utf-8,ID,Ngay,PhuongTien,HangMuc,ChiPhi,GhiChu\n";
            history.forEach(h => {
                const v = myVehicles.find(x => x.id === h.vehicleId);
                csvContent += `${h.id},${h.date},"${v ? v.name : ''}","${h.serviceName}",${h.cost},"${h.notes || ''}"\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `BaoCaoChiPhi_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // QUẢN TRỊ VIÊN (ADMIN DASHBOARD)
        function renderAdminTab(el) {
            const users = DB.get('users');
            const services = DB.get('services');

            el.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- QUẢN LÝ NGƯỜI DÙNG -->
                    <div class="bg-white p-5 rounded-lg shadow">
                        <h3 class="font-bold text-lg mb-3">Quản lý tài khoản người dùng</h3>
                        <table class="w-full text-left text-sm">
                            <thead class="border-b bg-gray-50">
                                <tr><th class="p-2">Tên</th><th class="p-2">Email</th><th class="p-2">Vai trò</th></tr>
                            </thead>
                            <tbody>
                                ${users.map(u => `
                                    <tr class="border-b"><td class="p-2">${u.name}</td><td class="p-2">${u.email}</td><td class="p-2 font-bold">${u.role}</td></tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>

                    <!-- QUẢN LÝ DANH MỤC DỊCH VỤ -->
                    <div class="bg-white p-5 rounded-lg shadow">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-bold text-lg">Danh mục dịch vụ chuẩn</h3>
                            <button onclick="addService()" class="bg-blue-600 text-white px-2 py-1 rounded text-xs">+ Thêm dịch vụ</button>
                        </div>
                        <table class="w-full text-left text-sm">
                            <thead class="border-b bg-gray-50">
                                <tr><th class="p-2">Tên dịch vụ</th><th class="p-2">Giá tham khảo</th></tr>
                            </thead>
                            <tbody>
                                ${services.map(s => `
                                    <tr class="border-b"><td class="p-2">${s.name}</td><td class="p-2 text-blue-600 font-semibold">${s.basePrice.toLocaleString()} VNĐ</td></tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function addService() {
            const name = prompt("Tên dịch vụ mới:");
            if (!name) return;
            const basePrice = parseInt(prompt("Giá tiêu chuẩn:", "100000")) || 0;
            const services = DB.get('services');
            services.push({ id: Date.now(), name, basePrice });
            DB.set('services', services);
            renderCurrentTabContent();
        }

        // ==========================================
        // 5. AUTHENTICATION (UC01 - LOGIN / REGISTER)
        // ==========================================
        function fillAndLogin(email, pass) {
            const users = DB.get('users');
            const user = users.find(u => u.email === email && u.pass === pass);
            if (user) {
                currentUser = user;
                sessionStorage.setItem('vms_currentUser', JSON.stringify(currentUser));
                currentTab = user.role === 'admin' ? 'admin' : 'vehicles';
                renderApp();
            } else {
                alert("Thông tin đăng nhập không hợp lệ!");
            }
        }

        function handleLogout() {
            sessionStorage.removeItem('vms_currentUser');
            currentUser = null;
            renderApp();
        }

        function renderLoginModal(isLogin) {
            const email = prompt("Nhập Email:", "user@gmail.com");
            if (!email) return;
            const pass = prompt("Nhập mật khẩu:", "123456");
            if (!pass) return;

            if (isLogin) {
                fillAndLogin(email, pass);
            } else {
                const name = prompt("Họ và tên của bạn:", "Người dùng mới");
                const users = DB.get('users');
                if (users.find(u => u.email === email)) {
                    alert("Email này đã được đăng ký!");
                    return;
                }
                const newUser = { id: Date.now(), name, email, pass, role: "owner" };
                users.push(newUser);
                DB.set('users', users);
                alert("Đăng ký thành công! Hãy đăng nhập.");
                fillAndLogin(email, pass);
            }
        }

        // Khởi động trang web
        renderApp();
    </script>
</body>
</html>
